const VENDOR_ORDER = (function() {
  const arr = [];
  const seen = new Set();
  for (const r of records) {
    if (r.v && !seen.has(r.v)) { seen.add(r.v); arr.push(r.v); }
  }
  return arr;
})();
const VENDOR_LABEL = (function() {
  const m = new Map();
  for (const r of records) {
    if (r.v && !m.has(r.v)) m.set(r.v, r.vf || r.v);
  }
  return m;
})();

function sum(arr, fn) {
  let s = 0;
  for (const x of arr) {
    const v = fn ? fn(x) : x;
    if (typeof v === 'number' && !isNaN(v)) s += v;
  }
  return s;
}
function uniq(arr, fn) {
  const seen = new Set();
  for (const x of arr) {
    const v = fn ? fn(x) : x;
    if (v != null && v !== '') seen.add(v);
  }
  return Array.from(seen);
}
function groupBy(arr, fn) {
  const m = new Map();
  for (const x of arr) {
    const k = fn(x);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  }
  return m;
}
function fmt(n) {
  if (n == null || isNaN(n)) return '0.0';
  return n.toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}
function fmtInt(n) {
  if (n == null || isNaN(n)) return '0';
  return Math.round(n).toLocaleString('ko-KR');
}
function pct(n) {
  if (n == null || isNaN(n)) return '0%';
  return Math.round(n * 100) + '%';
}
function isoWeek(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00Z');
  if (isNaN(d)) return '';
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return 'W' + String(wk).padStart(2, '0');
}
// 날짜 문자열(yyyy-mm-dd)에 n일 더하기
function addDaysStr(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  if (isNaN(d)) return dateStr;
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
// ISO 주(월~일)의 시작(월)·끝(일) 날짜
function isoWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  if (isNaN(d)) return dateStr;
  const off = (d.getUTCDay() + 6) % 7; // Mon=0 … Sun=6
  d.setUTCDate(d.getUTCDate() - off);
  return d.toISOString().slice(0, 10);
}
function isoWeekEnd(dateStr) { return addDaysStr(isoWeekStart(dateStr), 6); }
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function isValidEquip(e) {
  if (!e || typeof e !== 'string') return false;
  const s = e.trim();
  // 설비명: 알파벳 6글자 + 숫자 2자리 (예: ABCDEF12) 만 자료로 사용
  return /^[A-Za-z]{6}[0-9]{2}$/.test(s);
}

// 설비별 5대 공종(c)별 max(progress) Map<eq, Map<c, maxP>>
function buildEquipCategoryMax(records) {
  const m = new Map();
  for (const r of records) {
    if (!isValidEquip(r.e)) continue;
    if (typeof r.p !== 'number') continue;
    const c = normalizeCategory(r.c);
    if (!c) continue;
    if (!m.has(r.e)) m.set(r.e, new Map());
    const cMap = m.get(r.e);
    const prev = cMap.has(c) ? cMap.get(c) : -Infinity;
    if (r.p > prev) cMap.set(c, r.p);
  }
  return m;
}

function getEquipMasterCategories(eq) {
  if (!eq) return null;
  return EQUIP_MASTER.get(eq) || null;
}

function getEquipAvgPWithMaster(eq, cMaxMap) {
  const master = getEquipMasterCategories(eq);
  if (master && master.length > 0) {
    let total = 0;
    for (const c of master) {
      total += (cMaxMap && cMaxMap.has(c)) ? clamp01(cMaxMap.get(c)) : 0;
    }
    return total / master.length;
  }
  if (!cMaxMap || cMaxMap.size === 0) return 0;
  let total = 0;
  for (const p of cMaxMap.values()) total += clamp01(p);
  return total / cMaxMap.size;
}

function isEquipCompletedWithMaster(eq, cMaxMap) {
  const master = getEquipMasterCategories(eq);
  if (master && master.length > 0) {
    for (const c of master) {
      const p = (cMaxMap && cMaxMap.has(c)) ? cMaxMap.get(c) : 0;
      if (p < 1.0) return false;
    }
    return true;
  }
  if (!cMaxMap || cMaxMap.size === 0) return false;
  for (const p of cMaxMap.values()) if (p < 1.0) return false;
  return true;
}

// 설비별 공종(g)별 max(progress) Map<eq, Map<g, maxP>>
function buildEquipGongjongMax(records) {
  const m = new Map();
  for (const r of records) {
    if (!isValidEquip(r.e)) continue;
    if (typeof r.p !== 'number') continue;
    if (!m.has(r.e)) m.set(r.e, new Map());
    const gMap = m.get(r.e);
    const g = r.g || '(미지정)';
    const prev = gMap.has(g) ? gMap.get(g) : -Infinity;
    if (r.p > prev) gMap.set(g, r.p);
  }
  return m;
}

// 해당 설비 완료 여부: 모든 공종 max(p) >= 1.0
function isEquipCompletedFromMap(gMap) {
  if (!gMap || gMap.size === 0) return false;
  for (const p of gMap.values()) if (p < 1.0) return false;
  return true;
}

// 설비 평균 진행률 (공종별 max 평균, clamp 후)
function getEquipAvgPFromMap(gMap) {
  if (!gMap || gMap.size === 0) return 0;
  let total = 0;
  for (const p of gMap.values()) total += Math.min(1, Math.max(0, p));
  return total / gMap.size;
}

function computeEquipStats(records) {
  const validRecs = records.filter(r => isValidEquip(r.e));
  const allEquip = uniq(validRecs, r => r.e);
  const eqCMap = buildEquipCategoryMax(validRecs);
  let completed = 0;
  for (const eq of allEquip) {
    if (isEquipCompletedWithMaster(eq, eqCMap.get(eq))) completed++;
  }
  return { total: allEquip.length, inProgress: allEquip.length - completed, completed };
}

function heatColor(v) {
  v = clamp01(v);
  const stops = [
    [0.0, [241,243,245]],
    [0.3, [183,224,196]],
    [0.7, [40,167,69]],
    [1.0, [0,60,30]]
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const [s1, c1] = stops[i];
    const [s2, c2] = stops[i + 1];
    if (v >= s1 && v <= s2) {
      const t = (s2 === s1) ? 0 : (v - s1) / (s2 - s1);
      const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
      const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
      const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
  }
  return 'rgb(0,60,30)';
}

const barValuePlugin = {
  id: 'barValue',
  afterDatasetsDraw(chart) {
    const opts = chart.options.plugins && chart.options.plugins.barValue;
    if (!opts || !opts.display) return;
    const ctx = chart.ctx;
    const area = chart.chartArea;
    const isHorizontal = chart.options.indexAxis === 'y';
    ctx.save();
    ctx.font = '600 11px "Malgun Gothic", sans-serif';
    chart.data.datasets.forEach((dataset, di) => {
      if (dataset.type && dataset.type !== 'bar') return;
      const metaSet = chart.getDatasetMeta(di);
      metaSet.data.forEach((element, i) => {
        const value = dataset.data[i];
        if (value == null) return;
        const text = fmt(value);
        if (isHorizontal) {
          ctx.textBaseline = 'middle';
          const textWidth = ctx.measureText(text).width;
          let labelX = element.x + 6;
          let labelColor = '#333';
          let align = 'left';
          if (labelX + textWidth > area.right - 2) {
            labelX = element.x - 6;
            align = 'right';
            labelColor = '#fff';
          }
          ctx.textAlign = align;
          ctx.fillStyle = labelColor;
          ctx.fillText(text, labelX, element.y);
        } else {
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          let labelY = element.y - 4;
          let labelColor = '#333';
          if (labelY < area.top + 12) {
            labelY = element.y + 14;
            labelColor = '#fff';
          }
          ctx.fillStyle = labelColor;
          ctx.fillText(text, element.x, labelY);
        }
      });
    });
    ctx.restore();
  }
};
Chart.register(barValuePlugin);

const donutLabelPlugin = {
  id: 'donutLabel',
  afterDatasetsDraw(chart) {
    const opts = chart.options.plugins && chart.options.plugins.donutLabel;
    if (!opts || !opts.display) return;
    const ctx = chart.ctx;
    const metaSet = chart.getDatasetMeta(0);
    if (!metaSet || !metaSet.data) return;
    const dataset = chart.data.datasets[0];
    const labels = chart.data.labels;
    const area = chart.chartArea;

    let visibleTotal = 0;
    for (let i = 0; i < dataset.data.length; i++) {
      if (chart.getDataVisibility(i)) visibleTotal += dataset.data[i];
    }
    if (!visibleTotal) return;

    ctx.save();
    ctx.font = '600 10px "Malgun Gothic", sans-serif';

    metaSet.data.forEach((arc, i) => {
      if (!chart.getDataVisibility(i)) return;
      const value = dataset.data[i];
      if (value == null || value === 0) return;
      const ratio = value / visibleTotal;
      if (ratio < 0.02) return;

      const midAngle = (arc.startAngle + arc.endAngle) / 2;
      const cosA = Math.cos(midAngle);
      const sinA = Math.sin(midAngle);
      const outerR = arc.outerRadius;
      const cx = arc.x;
      const cy = arc.y;

      const x1 = cx + cosA * outerR;
      const y1 = cy + sinA * outerR;
      const x2 = cx + cosA * (outerR + 6);
      const y2 = cy + sinA * (outerR + 6);
      const isRight = cosA >= 0;
      const x3 = x2 + (isRight ? 5 : -5);
      const y3 = y2;

      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.stroke();

      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.arc(x1, y1, 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.textAlign = isRight ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      const text = labels[i] + ' ' + fmt(value);
      let tx = x3 + (isRight ? 3 : -3);
      const tw = ctx.measureText(text).width;
      if (isRight && tx + tw > area.right - 2) tx = area.right - 2 - tw;
      if (!isRight && tx - tw < area.left + 2) tx = area.left + 2 + tw;
      ctx.fillText(text, tx, y3);
    });

    ctx.restore();
  }
};
Chart.register(donutLabelPlugin);

function setupFilters() {
  const vendorMap = new Map();
  for (const r of records) {
    if (r.v && !vendorMap.has(r.v)) vendorMap.set(r.v, r.vf || r.v);
  }
  const vendorSel = document.getElementById('filterVendor');
  Array.from(vendorMap.entries())
    .sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'ko'))
    .forEach(([val, label]) => {
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = label;
      vendorSel.appendChild(opt);
    });

  const catSel = document.getElementById('filterCategory');
  CATEGORY_ORDER.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSel.appendChild(opt);
  });

  const eqInput = document.getElementById('filterEquip');
  const wkInput = document.getElementById('filterWorker');

  const allEquips = Array.from(new Set(records.filter(r => isValidEquip(r.e)).map(r => r.e))).sort();
  const allWorkers = Array.from(new Set(records.filter(r => r.w).map(r => r.w))).sort((a, b) => a.localeCompare(b, 'ko'));

  const dates = records.map(r => r.d).filter(d => !!d).sort();
  const ds = document.getElementById('filterDateStart');
  const de = document.getElementById('filterDateEnd');
  if (dates.length) {
    ds.min = dates[0]; ds.max = dates[dates.length - 1];
    de.min = dates[0]; de.max = dates[dates.length - 1];
  }

  const yearSel = document.getElementById('filterYear');
  const years = Array.from(new Set(records.filter(r => r.d).map(r => r.d.slice(0, 4)))).sort();
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y + '년';
    yearSel.appendChild(opt);
  });

  document.getElementById('exportedAt').textContent = '데이터 기준: ' + (meta.exported_at || '-');
  document.getElementById('recordTotal').textContent = records.length;

  vendorSel.addEventListener('change', e => { state.vendor = e.target.value; render(); });
  catSel.addEventListener('change',    e => { state.category = e.target.value; render(); });
  yearSel.addEventListener('change',   e => { state.year = e.target.value; render(); });
  ds.addEventListener('change',        e => { state.dateStart = e.target.value; render(); });
  de.addEventListener('change',        e => { state.dateEnd = e.target.value; render(); });

  function applyEquipSearch() {
    const q = eqInput.value.trim();
    state.equip = eqInput.value;
    const match = q ? allEquips.find(eq => eq.toLowerCase() === q.toLowerCase()) : null;
    if (match) {
      state.view = 'detail-equip';
      state.detailKey = match;
    } else if (state.view === 'detail-equip') {
      state.view = 'main';
      state.detailKey = '';
    }
    render();
  }
  function applyWorkerSearch() {
    const q = wkInput.value.trim();
    state.worker = wkInput.value;
    const match = q ? allWorkers.find(w => w.toLowerCase() === q.toLowerCase()) : null;
    if (match) {
      state.view = 'detail-worker';
      state.detailKey = match;
    } else if (state.view === 'detail-worker') {
      state.view = 'main';
      state.detailKey = '';
    }
    render();
  }
  function applyAllSearches() { applyEquipSearch(); applyWorkerSearch(); }

  setupCombo(eqInput, document.getElementById('comboEquip'),
    () => Array.from(new Set(applyFilter('equip').filter(r => isValidEquip(r.e)).map(r => r.e))).sort(),
    val => { eqInput.value = val; applyEquipSearch(); });
  setupCombo(wkInput, document.getElementById('comboWorker'),
    () => Array.from(new Set(applyFilter('worker').filter(r => r.w).map(r => r.w))).sort((a, b) => a.localeCompare(b, 'ko')),
    val => { wkInput.value = val; applyWorkerSearch(); });
  eqInput.addEventListener('keydown', e => { if (e.key === 'Enter') { applyEquipSearch(); e.preventDefault(); } });
  wkInput.addEventListener('keydown', e => { if (e.key === 'Enter') { applyWorkerSearch(); e.preventDefault(); } });
  document.getElementById('filterSearch').addEventListener('click', applyAllSearches);

  document.getElementById('filterReset').addEventListener('click', () => {
    state.vendor = ''; state.category = ''; state.equip = ''; state.worker = '';
    state.year = '';
    state.dateStart = ''; state.dateEnd = '';
    state.view = 'main'; state.detailKey = '';
    vendorSel.value = ''; catSel.value = ''; eqInput.value = ''; wkInput.value = '';
    yearSel.value = '';
    ds.value = ''; de.value = '';
    render();
  });
}

function setupCombo(input, panel, itemsFn, onCommit) {
  let hoverIdx = -1;
  let lastList = [];
  function renderOpts(q) {
    panel.innerHTML = '';
    const items = (typeof itemsFn === 'function') ? itemsFn() : itemsFn;
    const ql = q.toLowerCase().trim();
    const filtered = ql ? items.filter(it => it.toLowerCase().includes(ql)) : items;
    lastList = filtered.slice(0, 200);
    if (lastList.length === 0) {
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = '검색 결과 없음';
      panel.appendChild(e);
    } else {
      lastList.forEach((it, i) => {
        const div = document.createElement('div');
        div.className = 'opt';
        div.textContent = it;
        div.addEventListener('mousedown', () => { onCommit(it); panel.classList.remove('open'); });
        panel.appendChild(div);
      });
    }
    panel.classList.add('open');
    hoverIdx = -1;
  }
  input.addEventListener('focus', () => renderOpts(input.value));
  input.addEventListener('input', () => renderOpts(input.value));
  input.addEventListener('blur', () => setTimeout(() => panel.classList.remove('open'), 150));
  input.addEventListener('keydown', e => {
    if (!panel.classList.contains('open')) return;
    const opts = panel.querySelectorAll('.opt');
    if (e.key === 'ArrowDown') {
      hoverIdx = Math.min(opts.length - 1, hoverIdx + 1);
      opts.forEach((o, i) => o.classList.toggle('kbd-hover', i === hoverIdx));
      if (opts[hoverIdx]) opts[hoverIdx].scrollIntoView({ block: 'nearest' });
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      hoverIdx = Math.max(0, hoverIdx - 1);
      opts.forEach((o, i) => o.classList.toggle('kbd-hover', i === hoverIdx));
      if (opts[hoverIdx]) opts[hoverIdx].scrollIntoView({ block: 'nearest' });
      e.preventDefault();
    } else if (e.key === 'Enter' && hoverIdx >= 0 && lastList[hoverIdx]) {
      onCommit(lastList[hoverIdx]);
      panel.classList.remove('open');
      e.preventDefault();
    } else if (e.key === 'Escape') {
      panel.classList.remove('open');
    }
  });
}

function applyFilter(...except) {
  const ex = new Set(except);
  const equipQuery = state.equip.trim().toLowerCase();
  const workerQuery = state.worker.trim().toLowerCase();
  return records.filter(r => {
    if (!ex.has('vendor')   && state.vendor   && r.v !== state.vendor)   return false;
    if (!ex.has('category') && state.category && normalizeCategory(r.c) !== state.category) return false;
    if (!ex.has('equip') && equipQuery) {
      if (!isValidEquip(r.e)) return false;
      if (!r.e.toLowerCase().includes(equipQuery)) return false;
    }
    if (!ex.has('worker') && workerQuery) {
      if (!r.w) return false;
      if (!r.w.toLowerCase().includes(workerQuery)) return false;
    }
    if (!ex.has('year') && state.year) {
      if (!r.d || !r.d.startsWith(state.year + '-')) return false;
    }
    if (state.dateStart && r.d < state.dateStart) return false;
    if (state.dateEnd   && r.d > state.dateEnd)   return false;
    return true;
  });
}

function renderStickyXAxis(canvasId, chartKey, maxVal, leftPad) {
  destroyChart(chartKey);
  const c = document.getElementById(canvasId);
  if (!c) return;
  charts[chartKey] = new Chart(c.getContext('2d'), {
    type: 'bar',
    data: { labels: [''], datasets: [{ data: [0], backgroundColor: 'transparent', borderWidth: 0 }] },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      animation: false,
      layout: { padding: { left: leftPad || 0, right: 20, top: 2, bottom: 28 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false }, barValue: { display: false } },
      scales: {
        x: { beginAtZero: true, max: maxVal, position: 'bottom', ticks: { font: { size: 10 }, padding: 4 }, grid: { color: '#f0f0f0' } },
        y: { display: false, grid: { display: false } }
      }
    }
  });
}

function rebuildFilterOptions() {
  const vendorSel = document.getElementById('filterVendor');
  if (vendorSel) {
    const curV = state.vendor;
    const vSet = new Set();
    for (const r of applyFilter('vendor')) if (r.v) vSet.add(r.v);
    while (vendorSel.options.length > 1) vendorSel.remove(1);
    Array.from(vSet).sort((a, b) => {
      const la = VENDOR_LABEL.get(a) || a;
      const lb = VENDOR_LABEL.get(b) || b;
      return la.localeCompare(lb, 'ko');
    }).forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = VENDOR_LABEL.get(v) || v;
      vendorSel.appendChild(opt);
    });
    vendorSel.value = curV;
  }

  const catSel = document.getElementById('filterCategory');
  if (catSel) {
    const curC = state.category;
    const cSet = new Set();
    for (const r of applyFilter('category')) {
      const c = normalizeCategory(r.c);
      if (c) cSet.add(c);
    }
    while (catSel.options.length > 1) catSel.remove(1);
    CATEGORY_ORDER.filter(c => cSet.has(c)).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      catSel.appendChild(opt);
    });
    catSel.value = curC;
  }
}

function destroyChart(key) {
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
}

function renderKPI(data) {
  const totalMD = sum(data, r => r.m || 0);
  const stats = computeEquipStats(data);
  // 평균 진행률 = 설비별 마스터 평균진행률(getEquipAvgPWithMaster)의 평균
  const validRecs = data.filter(r => isValidEquip(r.e));
  const eqCMap = buildEquipCategoryMax(validRecs);
  const allEquip = uniq(validRecs, r => r.e);
  let progSum = 0, progN = 0;
  for (const eq of allEquip) {
    const v = getEquipAvgPWithMaster(eq, eqCMap.get(eq));
    if (typeof v === 'number' && !isNaN(v)) { progSum += v; progN++; }
  }
  const avgProg = progN ? (progSum / progN) : 0;
  const workerCount = uniq(data, r => r.w).length;

  document.getElementById('kpiManDays').innerHTML   = fmt(totalMD) + '<span class="kpi-unit">M/D</span>';
  document.getElementById('kpiEquip').innerHTML     = fmtInt(stats.inProgress) + '<span class="kpi-unit">대</span>';
  document.getElementById('kpiProgress').innerHTML  = pct(avgProg);
  document.getElementById('kpiCompleted').innerHTML = fmtInt(stats.completed) + '<span class="kpi-unit">대</span>';
  document.getElementById('kpiWorker').innerHTML    = fmtInt(workerCount) + '<span class="kpi-unit">명</span>';
}

// ── 층별 탭 상태 ────────────────────────────────────────────────────
const catFloorState = { floor: 'ALL' };
const FLOOR_ORDER = ['ALL', 'FSF', 'CSF', 'FAB', '천정', '외곽'];

function buildFloorTabs(data) {
  const wrap = document.getElementById('floorTabWrap');
  if (!wrap) return;
  // 데이터에 실제 존재하는 층 추출
  const exists = new Set(data.map(r => r.floor).filter(Boolean));
  const tabs = FLOOR_ORDER.filter(f => f === 'ALL' || exists.has(f));
  wrap.innerHTML = '';
  tabs.forEach(function(f) {
    const btn = document.createElement('button');
    const active = catFloorState.floor === f;
    btn.textContent = f === 'ALL' ? '전체' : f;
    btn.style.cssText = 'padding:2px 9px;font-size:11px;border-radius:3px;cursor:pointer;border:1px solid '
      + (active ? '#14B446' : '#d1d5db') + ';background:' + (active ? '#14B446' : '#fff')
      + ';color:' + (active ? '#fff' : '#555') + ';transition:all .1s;';
    btn.addEventListener('click', function() {
      catFloorState.floor = f;
      renderCategory(applyFilter('category'));
    });
    wrap.appendChild(btn);
  });
}

function renderCatFloorDetail(data) {
  const el = document.getElementById('catFloorDetail');
  if (!el) return;
  if (catFloorState.floor === 'ALL') { el.style.display = 'none'; return; }
  el.style.display = '';

  const CAT_COLOR = CATEGORY_COLOR;
  // 해당 층 데이터로 공종별 공수
  const floorData = data.filter(r => r.floor === catFloorState.floor);
  const grp = new Map();
  for (const r of floorData) {
    const c = normalizeCategory(r.c);
    if (!c) continue;
    grp.set(c, (grp.get(c)||0) + (r.m||0));
  }
  const entries = CATEGORY_ORDER.map(k => [k, grp.get(k)||0]).filter(([,v])=>v>0);
  if (!entries.length) { el.innerHTML = '<div style="color:#aaa;font-size:12px;padding:8px 0;">해당 층 데이터 없음</div>'; return; }

  const total = entries.reduce((s,[,v])=>s+v,0);
  let h = '<div style="border-top:1px solid #f0f0f0;padding-top:10px;">';
  h += '<div style="font-size:11px;color:#888;margin-bottom:6px;font-weight:500;">'
     + catFloorState.floor + ' 층 공종별 공수 분포 (총 ' + total.toFixed(1) + ' M/D)</div>';
  h += '<div style="display:flex;flex-direction:column;gap:5px;">';
  for (const [cat, val] of entries) {
    const pct = total ? (val / total * 100) : 0;
    const color = CAT_COLOR[cat] || PRIMARY;
    h += '<div style="display:flex;align-items:center;gap:8px;">'
       + '<div style="width:70px;font-size:11px;color:#555;text-align:right;flex-shrink:0;">' + cat + '</div>'
       + '<div style="flex:1;height:14px;background:#f0f0f0;border-radius:3px;overflow:hidden;">'
       +   '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+color+';border-radius:3px;transition:width .3s;"></div>'
       + '</div>'
       + '<div style="width:85px;font-size:11px;color:#555;flex-shrink:0;">'
       +   fmt(val) + ' M/D <span style="color:#aaa;">(' + pct.toFixed(1) + '%)</span>'
       + '</div>'
       + '</div>';
  }
  h += '</div></div>';
  el.innerHTML = h;
}

function renderCategory(data) {
  destroyChart('cat');
  buildFloorTabs(data);

  // 층 필터 적용
  const filtered = catFloorState.floor === 'ALL'
    ? data
    : data.filter(r => r.floor === catFloorState.floor);

  const grpMap = new Map();
  for (const r of filtered) {
    const norm = normalizeCategory(r.c);
    if (!norm) continue;
    grpMap.set(norm, (grpMap.get(norm) || 0) + (r.m || 0));
  }
  const entries = CATEGORY_ORDER
    .map(k => [k, grpMap.get(k) || 0])
    .filter(([, v]) => v > 0);
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const hasCatFilter = !!state.category;
  const colors = labels.map(l => {
    if (hasCatFilter) return l === state.category ? (CATEGORY_COLOR[l] || PRIMARY) : MUTED;
    return CATEGORY_COLOR[l] || PRIMARY;
  });
  const total = values.reduce((a, b) => a + b, 0);
  const ctx = document.getElementById('chartCategory').getContext('2d');
  charts.cat = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 1, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 12, bottom: 12, left: 70, right: 8 } },
      radius: '72%',
      cutout: '55%',
      onClick: (evt, elements) => {
        if (elements && elements.length > 0) {
          const cat = labels[elements[0].index];
          state.category = (state.category === cat) ? '' : cat;
          const catSel = document.getElementById('filterCategory');
          if (catSel) catSel.value = state.category;
          render();
        }
      },
      plugins: {
        legend: {
          position: 'right',
          labels: { font: { size: 11 }, boxWidth: 12, padding: 6 },
          onClick: (e, item) => {
            const cat = item.text;
            state.category = (state.category === cat) ? '' : cat;
            const catSel = document.getElementById('filterCategory');
            if (catSel) catSel.value = state.category;
            render();
          }
        },
        donutLabel: { display: true },
        tooltip: {
          callbacks: {
            label: function(c) {
              const v = c.parsed;
              const p = total ? (v / total * 100).toFixed(1) : '0.0';
              return c.label + ': ' + fmt(v) + ' M/D (' + p + '%)';
            }
          }
        }
      }
    }
  });

  renderCatFloorDetail(data);
}

function renderVendor(data) {
  destroyChart('ven');

  const venFiltered = venLocState.loc === 'out'
    ? data.filter(r => r.floor === '외곽')
    : venLocState.loc === 'in'
    ? data.filter(r => r.floor !== '외곽')
    : data;

  renderVenLocSummary(data, venLocState.loc);

  const grp = new Map();
  for (const r of venFiltered) {
    if (!r.v) continue;
    if (!grp.has(r.v)) grp.set(r.v, []);
    grp.get(r.v).push(r);
  }

  const entries = VENDOR_ORDER.map(v => {
    const arr = grp.get(v) || [];
    const stats = computeEquipStats(arr);
    return {
      key: v,
      label: VENDOR_LABEL.get(v) || v,
      value: sum(arr, r => r.m || 0),
      inProg: stats.inProgress,
      completed: stats.completed,
      total: stats.total
    };
  });

  const labels = entries.map(e => e.label);
  const values = entries.map(e => e.value);
  const lineValues = entries.map(e => e.inProg);

  const highlightVendors = new Set();
  if (state.vendor) highlightVendors.add(state.vendor);
  const workerQ = state.worker.trim().toLowerCase();
  if (workerQ) {
    for (const r of records) {
      if (r.w && r.w.toLowerCase().includes(workerQ) && r.v) {
        highlightVendors.add(r.v);
      }
    }
  }
  const hasHighlight = highlightVendors.size > 0;
  const colors = entries.map((e, i) => {
    if (hasHighlight) return highlightVendors.has(e.key) ? PALETTE[i % PALETTE.length] : MUTED;
    return PALETTE[i % PALETTE.length];
  });

  const ctx = document.getElementById('chartVendor').getContext('2d');
  charts.ven = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          type: 'bar',
          label: '공수 (M/D)',
          data: values,
          backgroundColor: colors,
          borderWidth: 0,
          yAxisID: 'y',
          order: 2
        },
        {
          type: 'line',
          label: '진행 중 설비 (대)',
          data: lineValues,
          borderColor: LINE_COLOR,
          backgroundColor: LINE_COLOR,
          pointBackgroundColor: LINE_COLOR,
          pointBorderColor: '#fff',
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0.25,
          borderWidth: 2,
          yAxisID: 'y2',
          order: 1
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 48 } },
      onClick: (evt, elements) => {
        if (elements && elements.length > 0) {
          const idx = elements[0].index;
          const vk = entries[idx].key;
          state.vendor = (state.vendor === vk) ? '' : vk;
          const vSel = document.getElementById('filterVendor');
          if (vSel) vSel.value = state.vendor;
          render();
        }
      },
      plugins: {
        legend: { display: true, position: 'top', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
        barValue: { display: true },
        vendorEquipLabel: {
          id: 'vendorEquipLabel',
          afterDatasetsDraw(chart) {
            const { ctx, data, scales } = chart;
            const barDs = chart.data.datasets.findIndex(d => d.type === 'bar' || !d.type);
            if (barDs < 0) return;
            const meta = chart.getDatasetMeta(barDs);
            ctx.save();
            meta.data.forEach(function(bar, i) {
              const entry = entries[i];
              if (!entry || !entry.total) return;
              const x = bar.x;
              const top = bar.y - 4;
              // 진행중 / 완료
              const progTxt  = entry.inProg + '진행';
              const compTxt  = entry.completed + '완료';
              const totalTxt = '총' + entry.total + '대';
              // 배경 박스
              const lineH = 13, pad = 4, boxW = 52;
              const boxH = lineH * 3 + pad * 2;
              const bx = x - boxW / 2, by = top - boxH - 4;
              ctx.fillStyle = 'rgba(255,255,255,0.92)';
              ctx.strokeStyle = '#e5e7eb';
              ctx.lineWidth = 1;
              const r = 4;
              ctx.beginPath();
              ctx.moveTo(bx+r, by); ctx.lineTo(bx+boxW-r, by);
              ctx.quadraticCurveTo(bx+boxW, by, bx+boxW, by+r);
              ctx.lineTo(bx+boxW, by+boxH-r);
              ctx.quadraticCurveTo(bx+boxW, by+boxH, bx+boxW-r, by+boxH);
              ctx.lineTo(bx+r, by+boxH);
              ctx.quadraticCurveTo(bx, by+boxH, bx, by+boxH-r);
              ctx.lineTo(bx, by+r);
              ctx.quadraticCurveTo(bx, by, bx+r, by);
              ctx.closePath();
              ctx.fill(); ctx.stroke();
              // 텍스트
              ctx.textAlign = 'center';
              ctx.font = 'bold 9px sans-serif';
              ctx.fillStyle = '#fd7e14';
              ctx.fillText(progTxt, x, by + pad + lineH * 0.85);
              ctx.fillStyle = '#2E7D32';
              ctx.fillText(compTxt, x, by + pad + lineH * 1.85);
              ctx.fillStyle = '#888';
              ctx.font = '9px sans-serif';
              ctx.fillText(totalTxt, x, by + pad + lineH * 2.85);
            });
            ctx.restore();
          }
        },
        tooltip: {
          callbacks: {
            label: function(c) {
              if (c.dataset.type === 'line') return c.dataset.label + ': ' + fmtInt(c.parsed.y) + '대';
              const e = entries[c.dataIndex];
              const eq = e ? ('진행 ' + e.inProg + '대 / 완료 ' + e.completed + '대 / 전체 ' + e.total + '대') : '';
              return [fmt(c.parsed.y) + ' M/D', eq];
            }
          }
        }
      },
      scales: {
        x: { ticks: { font: { size: 10 }, autoSkip: false, maxRotation: 35, minRotation: 0 }, grid: { display: false } },
        y: {
          beginAtZero: true, position: 'left',
          ticks: { font: { size: 10 } },
          grid: { color: '#f0f0f0' },
          title: { display: true, text: '공수 (M/D)', font: { size: 10 }, color: '#666' }
        },
        y2: {
          beginAtZero: true, position: 'right',
          ticks: { font: { size: 10 }, precision: 0 },
          grid: { drawOnChartArea: false },
          title: { display: true, text: '진행 중 설비 (대)', font: { size: 10 }, color: '#666' }
        }
      }
    }
  });
}

function renderTop10(data) {
  destroyChart('top10');
  const valid = data.filter(r => isValidEquip(r.e));
  const grp   = groupBy(valid, r => r.e);

  const eqCMap = buildEquipCategoryMax(valid);

  const entries = Array.from(grp.entries())
    .map(([k, arr]) => {
      const md   = sum(arr, r => r.m || 0);
      const prog = getEquipAvgPWithMaster(k, eqCMap.get(k));
      return [k, md, prog];
    })
    .filter(([, md]) => md > 0)
    .sort(function(a, b) {
      const key = top10SortState.key;
      const dir = top10SortState.dir === 'asc' ? 1 : -1;
      if (key === 'p') {
        const pa = a[2] ?? -1, pb = b[2] ?? -1;
        return (pa - pb) * dir;
      }
      return (a[1] - b[1]) * dir; // md
    });

  const labels   = entries.map(e => e[0]);
  const mdValues = entries.map(e => e[1]);          // 실제 공수
  const progVals = entries.map(e => e[2]);           // 진척률 0~1
  // ★ 바 길이 = 진척률 (0~100)
  const barData  = progVals.map(p => p != null ? Math.round(p * 100) : null);

  // 진척률 기준 색상
  const colors = barData.map(p =>
    p == null ? 'rgba(0,0,0,0)' :
    p >= 80   ? '#2E7D32' :
    p >= 40   ? '#fd7e14' : '#4e8ef7'
  );

  // 빈 슬롯 PAD
  const WRAP_H = 480, SLOT_PX = 38, HEADER_PX = 40;
  const MIN_SLOTS = Math.floor((WRAP_H - HEADER_PX) / SLOT_PX);
  while (labels.length < MIN_SLOTS) {
    labels.push(''); mdValues.push(null); progVals.push(null);
    barData.push(null); colors.push('rgba(0,0,0,0)');
  }

  const inner = document.getElementById('chartTop10Inner');
  if (inner) inner.style.height = Math.max(WRAP_H, labels.length * SLOT_PX + HEADER_PX) + 'px';

  const ctx = document.getElementById('chartTop10').getContext('2d');

  // 라벨 드로잉 플러그인
  const labelPlugin = {
    id: 'top10Labels',
    afterDatasetsDraw(chart) {
      const { ctx: c, scales } = chart;
      const meta = chart.getDatasetMeta(0);
      c.save();
      meta.data.forEach(function(bar, i) {
        const pct  = barData[i];
        const md   = mdValues[i];
        if (pct == null || md == null) return;

        const barRight = scales.x.getPixelForValue(pct);
        const barLeft  = scales.x.getPixelForValue(0);
        const barW     = barRight - barLeft;
        const cy       = bar.y;
        const barH     = bar.height;

        // ① 진척률 % — 바 내부 오른쪽
        const pctText = pct + '%';
        c.font = 'bold 10px "Malgun Gothic",sans-serif';
        const pctW = c.measureText(pctText).width;
        const minInner = pctW + 12;

        if (barW >= minInner) {
          const tx = barRight - 6 - pctW / 2;
          // 흰 pill
          c.fillStyle = 'rgba(255,255,255,0.75)';
          c.beginPath();
          if (c.roundRect) c.roundRect(tx - pctW/2 - 3, cy - 7, pctW + 6, 14, 3);
          else c.rect(tx - pctW/2 - 3, cy - 7, pctW + 6, 14);
          c.fill();
          // 텍스트
          c.fillStyle = pct >= 80 ? '#145a20' : pct >= 40 ? '#7a3000' : '#0b3872';
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(pctText, tx, cy);
        } else {
          // 바가 좁으면 바 오른쪽 외부
          c.fillStyle = pct >= 80 ? '#2E7D32' : pct >= 40 ? '#c85000' : '#185fa5';
          c.font = '9px "Malgun Gothic",sans-serif';
          c.textAlign = 'left';
          c.textBaseline = 'middle';
          c.fillText(pctText, barRight + 3, cy);
        }

        // ② 공수 M/D — 바 오른쪽 외부 (% 텍스트 뒤)
        const mdText = fmt(md) + ' M/D';
        c.font = '10px "Malgun Gothic",sans-serif';
        const mdW = c.measureText(mdText).width;
        // 외부 여백 계산: pct텍스트가 외부에 있으면 그 뒤, 내부에 있으면 barRight+6
        const externalPctW = barW < minInner ? c.measureText(pctText).width + 8 : 0;
        const mdX = barRight + 6 + externalPctW;
        c.fillStyle = '#777';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(mdText, mdX, cy);
      });
      c.restore();
    }
  };

  charts.top10 = new Chart(ctx, {
    type: 'bar',
    plugins: [labelPlugin],
    data: {
      labels,
      datasets: [{
        data: barData,
        backgroundColor: colors,
        borderRadius: 4,
        borderWidth: 0,
        maxBarThickness: 18,
        minBarLength: 2,
        barPercentage: 0.55,
        categoryPercentage: 0.8
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 70 } },
      plugins: {
        legend: { display: false },
        barValue: { display: false },
        tooltip: {
          filter: c => c.parsed.x != null,
          callbacks: {
            label: function(c) {
              const md  = mdValues[c.dataIndex];
              const p   = barData[c.dataIndex];
              return [
                '진척률: ' + (p != null ? p : '-') + '%',
                '공수: '   + (md != null ? fmt(md) : '-') + ' M/D'
              ];
            }
          }
        }
      },
      scales: {
        x: {
          beginAtZero: true, min: 0, max: 100,
          display: false,
          grid: { color: '#f0f0f0' }
        },
        y: { ticks: { font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
  renderStickyXAxis('chartTop10Axis', 'top10Axis', 100,
    charts.top10.chartArea ? charts.top10.chartArea.left : 0);
  requestAnimationFrame(() => {
    if (!charts.top10) return;
    const left = charts.top10.chartArea ? charts.top10.chartArea.left : 0;
    renderStickyXAxis('chartTop10Axis', 'top10Axis', 100, left);
  });
}

// ── 특이사항 필터 상태 ───────────────────────────────────────────────
const notesFilterState = { range: 'all' };

function toggleEquipNotes(headerEl) {
  const body = headerEl.nextElementSibling;
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  const arr = headerEl.querySelector('.eq-arrow');
  if (arr) arr.textContent = hidden ? '▾' : '▸';
}

function setNotesFilter(range) {
  notesFilterState.range = range;
  ['All','Week','Today'].forEach(function(k) {
    const btn = document.getElementById('notesF' + k);
    if (!btn) return;
    const active = k.toLowerCase() === range;
    btn.style.background = active ? '#14B446' : '#fff';
    btn.style.color = active ? '#fff' : '#555';
    btn.style.borderColor = active ? '#14B446' : '#d1d5db';
  });
  renderNotes(applyFilter());
}

function renderNotes(data) {
  const el = document.getElementById('notesBody');
  if (!el) return;

  // 날짜 범위 필터
  const todayStr = cstToday();
  const weekStart = (function() {
    const d = new Date(todayStr + 'T00:00:00Z');
    const day = d.getUTCDay(); // 0=일
    d.setUTCDate(d.getUTCDate() - day);
    return d.toISOString().slice(0,10);
  })();

  const rangeFilter = function(r) {
    if (!r.d) return false;
    if (notesFilterState.range === 'today') return r.d === todayStr;
    if (notesFilterState.range === 'week')  return r.d >= weekStart;
    return true;
  };

  // 검색어
  const searchEl = document.getElementById('notesSearch');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';

  // 의미있는 특이사항만, 범위 필터 적용
  const noteRecs = data.filter(function(r) {
    if (!_isMeaningfulNote(r.note)) return false;
    if (!rangeFilter(r)) return false;
    if (q) {
      const hay = ((r.e||'') + (r.w||'') + (r.note||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // 배지 업데이트
  const badge = document.getElementById('notesBadge');
  if (badge) {
    const eqCount = new Set(noteRecs.map(r=>r.e).filter(Boolean)).size;
    badge.textContent = eqCount + '개 설비 · ' + noteRecs.length + '건';
  }

  if (!noteRecs.length) {
    el.innerHTML = '<div style="color:#aaa;font-size:12px;padding:16px;text-align:center;">해당 조건에 특이사항 없음</div>';
    return;
  }

  // 설비별 그룹핑
  const byEq = new Map();
  noteRecs.forEach(function(r) {
    const eq = r.e || '(설비 미상)';
    if (!byEq.has(eq)) byEq.set(eq, []);
    byEq.get(eq).push(r);
  });

  // 설비 정렬: 특이사항 많은 순
  const eqSorted = [...byEq.entries()].sort((a,b) => b[1].length - a[1].length);

  const VC = {'주민':'#2E7D32','동영':'#fd7e14','새로':'#4e8ef7','제이엠':'#6f42c1','주민 사외':'#1b5e20','동영 사외':'#c75f00','새로 사외':'#2c5fb0','제이엠 사외':'#4a2d80'};
  let h = '';

  for (const [eq, recs] of eqSorted) {
    // 설비의 최신 진척률
    const ps = recs.filter(r=>typeof r.p==='number').map(r=>r.p);
    const maxP = ps.length ? Math.max(...ps) : null;
    const pBadge = maxP != null
      ? '<span style="font-size:10px;background:#e8f5e9;color:#2E7D32;padding:1px 5px;border-radius:3px;margin-left:4px;">' + Math.round(maxP*100) + '%</span>'
      : '';

    h += '<div style="margin-bottom:10px;border:0.5px solid #e5e7eb;border-radius:8px;overflow:hidden;">';
    // 설비 헤더
    h += '<div style="background:#f8faf8;padding:7px 12px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;" onclick="toggleEquipNotes(this)">';
    h += '<span style="font-size:12px;font-weight:600;color:#1a5c20;">' + escapeHtml(eq) + pBadge + '</span>';
    h += '<span style="font-size:10px;color:#aaa;margin-left:4px;">' + recs.length + '건</span>';
    h += '<span class="eq-arrow" style="font-size:10px;color:#bbb;margin-left:auto;">▾</span>';
    h += '</div>';
    // 특이사항 목록
    h += '<div style="padding:6px 10px;display:flex;flex-direction:column;gap:4px;">';
    const recsSorted = recs.slice().sort((a,b)=>(a.d||'').localeCompare(b.d||''));
    for (const r of recsSorted) {
      const dot = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+(VC[r.v]||'#aaa')+';margin-right:4px;flex-shrink:0;margin-top:4px;"></span>';
      const datePart = r.d ? '<span style="font-size:10px;color:#bbb;margin-right:5px;flex-shrink:0;">' + r.d.slice(5) + '</span>' : '';
      const workerPart = '<span style="font-size:10px;font-weight:600;color:#555;margin-right:5px;flex-shrink:0;">' + escapeHtml(r.w||'') + '</span>';
      const catPart = r.c ? '<span style="font-size:9px;background:#f0f0f0;color:#888;padding:1px 4px;border-radius:3px;margin-right:5px;flex-shrink:0;">' + escapeHtml(r.c) + '</span>' : '';
      h += '<div style="display:flex;align-items:flex-start;padding:5px 2px;border-bottom:1px solid #f5f5f5;font-size:12px;color:#444;line-height:1.5;">'
         + dot + datePart + workerPart + catPart
         + '<span style="word-break:break-all;">' + escapeHtml(r.note).replace(/\n/g,' / ') + '</span>'
         + '</div>';
    }
    h += '</div></div>';
  }

  el.innerHTML = h;
}

// ── 히트맵 상태 ──────────────────────────────────────────────────────
const hmState = { mode: 'week', sort: 'md', floor: 'ALL' };

// 히트맵 층 필터 탭 (전체 / FSF / CSF / FAB / 천정 …)
function buildHmFloorTabs(data) {
  const wrap = document.getElementById('hmFloorWrap');
  if (!wrap) return;
  const exists = new Set(data.map(r => r.floor).filter(Boolean));
  const tabs = FLOOR_ORDER.filter(f => f === 'ALL' || exists.has(f));
  // 선택된 층이 더 이상 데이터에 없으면 전체로 복귀
  if (hmState.floor !== 'ALL' && !exists.has(hmState.floor)) hmState.floor = 'ALL';
  wrap.innerHTML = '';
  if (tabs.length <= 1) return;  // 층 구분이 없으면 탭 숨김
  const lbl = document.createElement('span');
  lbl.textContent = '작업위치';
  lbl.style.cssText = 'font-size:11px;color:#888;margin-right:2px;';
  wrap.appendChild(lbl);
  tabs.forEach(function(f) {
    const btn = document.createElement('button');
    const active = hmState.floor === f;
    btn.textContent = f === 'ALL' ? '전체' : f;
    btn.style.cssText = 'padding:2px 9px;font-size:11px;border-radius:3px;cursor:pointer;border:1px solid '
      + (active ? '#14B446' : '#d1d5db') + ';background:' + (active ? '#14B446' : '#fff')
      + ';color:' + (active ? '#fff' : '#555') + ';transition:all .1s;';
    btn.addEventListener('click', function() {
      hmState.floor = f;
      renderHeatmap(applyFilter());
    });
    wrap.appendChild(btn);
  });
}

function setHmMode(m) {
  hmState.mode = m;
  ['Week','Day'].forEach(function(k) {
    const btn = document.getElementById('hmMode'+k);
    if (!btn) return;
    const active = (k.toLowerCase() === m);
    btn.style.background = active ? '#14B446' : '#fff';
    btn.style.color = active ? '#fff' : '#555';
  });
  renderHeatmap(applyFilter());
}
function setHmSort(s) {
  hmState.sort = s;
  ['Md','Desc','Asc'].forEach(function(k) {
    const btn = document.getElementById('hmSort'+k);
    if (!btn) return;
    const key = k === 'Md' ? 'md' : k.toLowerCase();
    const active = (key === s);
    btn.style.background = active ? '#14B446' : '#fff';
    btn.style.color = active ? '#fff' : '#555';
  });
  renderHeatmap(applyFilter());
}

function renderHeatmap(data) {
  const wrap = document.getElementById('heatmap');
  wrap.innerHTML = '';

  // 층 탭은 (층 필터 적용 전) 전체 데이터 기준으로 구성
  buildHmFloorTabs(data);
  if (hmState.floor !== 'ALL') data = data.filter(r => r.floor === hmState.floor);

  const valid = data.filter(r => isValidEquip(r.e));
  if (valid.length === 0) {
    wrap.innerHTML = '<div class="empty-msg">표시할 데이터가 없습니다.</div>';
    return;
  }

  const byMD = groupBy(valid, r => r.e);
  // 전체 설비 목록 (공수 > 0)
  const allEqMD = Array.from(byMD.entries())
    .map(([k, arr]) => [k, sum(arr, r => r.m || 0)])
    .filter(([, v]) => v > 0);
  if (!allEqMD.length) {
    wrap.innerHTML = '<div class="empty-msg">표시할 데이터가 없습니다.</div>';
    return;
  }

  // ── 컬럼(시간축) 계산 ────────────────────────────────────────────────
  const isDay = hmState.mode === 'day';
  const colKey = isDay ? (r => r.d) : (r => isoWeek(r.d));
  const colSet = new Set();
  for (const r of valid) {
    if (!normalizeCategory(r.c)) continue;
    const k = colKey(r);
    if (k) colSet.add(k);
  }
  const cols = Array.from(colSet).sort();

  if (!cols.length) {
    wrap.innerHTML = '<div class="empty-msg">표시할 데이터가 없습니다.</div>';
    return;
  }

  // ── 설비별 × 컬럼별 누적 max 평균 계산 ──────────────────────────────
  const allEqIds = allEqMD.map(e => e[0]);
  const eqColCat = new Map();
  for (const eq of allEqIds) eqColCat.set(eq, new Map());
  for (const r of valid) {
    if (!eqColCat.has(r.e)) continue;
    if (typeof r.p !== 'number') continue;
    const c = normalizeCategory(r.c);
    if (!c) continue;
    const k = colKey(r);
    if (!k) continue;
    const cMap = eqColCat.get(r.e);
    if (!cMap.has(k)) cMap.set(k, new Map());
    const prev = cMap.get(k).get(c) ?? -Infinity;
    if (r.p > prev) cMap.get(k).set(c, r.p);
  }

  const cellMap = new Map();
  for (const eq of allEqIds) {
    cellMap.set(eq, new Map());
    const cMap = eqColCat.get(eq);
    const cum = new Map();
    for (const col of cols) {
      const cw = cMap.get(col);
      if (cw) for (const [c,v] of cw) { if (v > (cum.get(c)??-Infinity)) cum.set(c,v); }
      const master = getEquipMasterCategories(eq);
      let avg = 0;
      if (master && master.length > 0) {
        let tot = 0;
        for (const c of master) tot += clamp01(cum.has(c) ? cum.get(c) : 0);
        avg = tot / master.length;
      } else if (cum.size > 0) {
        let tot = 0;
        for (const v of cum.values()) tot += clamp01(v);
        avg = tot / cum.size;
      }
      cellMap.get(eq).set(col, avg);
    }
  }

  // ── 마지막 컬럼 진척률 계산 (정렬용) ─────────────────────────────────
  const lastCol = cols[cols.length - 1];
  const getLatestP = eq => cellMap.get(eq)?.get(lastCol) ?? 0;
  const getMD      = eq => allEqMD.find(([k])=>k===eq)?.[1] ?? 0;

  let sortedEq;
  if (hmState.sort === 'asc')  sortedEq = [...allEqIds].sort((a,b) => getLatestP(a) - getLatestP(b));
  else if (hmState.sort === 'desc') sortedEq = [...allEqIds].sort((a,b) => getLatestP(b) - getLatestP(a));
  else sortedEq = [...allEqIds].sort((a,b) => getMD(b) - getMD(a));

  // ── 범례 노트 ─────────────────────────────────────────────────────────
  const noteEl = document.getElementById('hmLegendNote');
  if (noteEl) {
    const sortLabel = hmState.sort==='asc' ? '진척률 오름차순' : hmState.sort==='desc' ? '진척률 내림차순' : '공수 내림차순';
    const modeLabel = isDay ? '일별' : '주차별';
    noteEl.textContent = modeLabel + ' · ' + sortLabel + ' · ' + sortedEq.length + '개 설비';
  }

  // ── 그리드 렌더 ──────────────────────────────────────────────────────
  const grid = document.createElement('div');
  grid.className = 'heatmap';
  // 일별 모드는 컬럼 너비 좁게
  const colW = isDay ? 'minmax(28px,36px)' : 'minmax(38px,auto)';
  grid.style.gridTemplateColumns = 'minmax(110px,180px) repeat(' + cols.length + ', ' + colW + ')';

  // 코너 + 헤더
  const corner = document.createElement('div');
  corner.className = 'hm-cell hm-corner';
  corner.textContent = isDay ? '날짜 →' : '주차 →';
  corner.style.cssText += 'font-size:10px;color:#aaa;font-weight:400;';
  grid.appendChild(corner);
  for (const col of cols) {
    const c = document.createElement('div');
    c.className = 'hm-cell hm-col-label';
    // 일별: MM/DD 형식으로 짧게
    c.textContent = isDay ? col.slice(5).replace('-','/') : col;
    c.title = col;
    grid.appendChild(c);
  }

  // 데이터 행
  for (const eq of sortedEq) {
    const latestP = getLatestP(eq);
    const label = document.createElement('div');
    label.className = 'hm-cell hm-row-label';
    label.textContent = eq;
    label.title = eq + ' — 현재 ' + Math.round(latestP*100) + '%';
    // 진척률 정렬 모드일 때 행 레이블에 % 배지 표시
    if (hmState.sort !== 'md') {
      const badge = document.createElement('span');
      badge.style.cssText = 'margin-left:4px;font-size:9px;padding:1px 4px;border-radius:3px;background:#e8f5e9;color:#2E7D32;font-weight:600;';
      badge.textContent = Math.round(latestP*100)+'%';
      label.appendChild(badge);
    }
    grid.appendChild(label);

    const wkMap = cellMap.get(eq);
    for (const col of cols) {
      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      const avg = wkMap?.has(col) ? wkMap.get(col) : 0;
      const display = Math.round(avg * 100);
      // 값이 없는 셀은 빈칸
      if (avg === 0) {
        cell.textContent = '';
        cell.style.background = '#f8f9fa';
        cell.style.color = '#ccc';
      } else {
        cell.textContent = display;
        cell.style.background = heatColor(avg);
        cell.style.color = clamp01(avg) > 0.5 ? '#fff' : '#003C1E';
      }
      cell.title = eq + ' / ' + col + ': ' + display + '%  (클릭하면 세부 내역 표시)';
      if (avg > 0) {
        cell.classList.add('clickable');
        (function(e2, c2, cl2) {
          cell.addEventListener('click', function() {
            const fd = applyFilter();
            openHmModal(e2, c2, cl2, hmState.floor === 'ALL' ? fd : fd.filter(r => r.floor === hmState.floor));
          });
        })(eq, col, col);
      }
      grid.appendChild(cell);
    }
  }
  wrap.appendChild(grid);
}


// ── 히트맵 셀 클릭 모달 ─────────────────────────────────────────────
// ── 특이사항 필터: 없음·단순지원 제외 ────────────────────────────────
function _isMeaningfulNote(note) {
  if (!note) return false;
  const t = note.trim();
  // 빈값·없음·x 류
  if (/^[없xX\s-]{0,5}$/.test(t)) return false;
  if (/^없[음은]$/.test(t)) return false;
  // 단순 지원 패턴: 이름/팀 + 지원 으로만 구성된 짧은 문장
  // "김민성팀 지원", "박상영 배관사 지원", "조국희팀 지원", "이성운 배관사 지원"
  if (t.length <= 30 && /지원\s*$/.test(t) &&
      !/비계|간섭|미반입|미입고|루트|수정|설치불가|로스|대기|완료|변경|확인|방문|측정|실측|불량|타공|용접|작업/.test(t)) {
    return false;
  }
  return true;
}

function openHmModal(eq, col, colLabel, allData) {
  const isDay = hmState.mode === 'day';
  // 인력 테이블: 클릭한 기간의 레코드만
  const recs = allData.filter(function(r) {
    if (r.e !== eq) return false;
    if (!r.d) return false;
    const k = isDay ? r.d : isoWeek(r.d);
    return k === col;
  });
  // 특이사항: 해당 설비의 전체 기간 레코드 (일별 모드에서도 모두 표시)
  const allEqRecs = allData.filter(function(r) {
    return r.e === eq && r.d;
  });

  if (!recs.length) {
    alert('해당 기간에 데이터가 없습니다.');
    return;
  }

  document.getElementById('hmModalTitle').textContent = eq;
  document.getElementById('hmModalSub').textContent =
    (isDay ? col : col + ' (' + colLabel + ')') +
    '  ·  작업자 ' + new Set(recs.filter(r=>r.w).map(r=>r.w)).size + '명  ·  ' +
    recs.length + '건';

  const sorted = recs.slice().sort(function(a,b) {
    const vc = (a.v||'').localeCompare(b.v||'', 'ko');
    if (vc !== 0) return vc;
    return (a.w||'').localeCompare(b.w||'', 'ko');
  });

  const VC = {'주민':'#2E7D32','동영':'#fd7e14','새로':'#4e8ef7','제이엠':'#6f42c1','주민 사외':'#1b5e20','동영 사외':'#c75f00','새로 사외':'#2c5fb0','제이엠 사외':'#4a2d80'};

  const progCell = function(r) {
    if (r.c === '용접사') {
      return r.wp ? '<span style="font-size:11px;background:#fff3cd;color:#856404;padding:1px 5px;border-radius:3px;">' + r.wp + ' pt</span>' : '─';
    }
    if (typeof r.p !== 'number') return '─';
    const pct = Math.min(100, Math.round(r.p * 100));
    const color = pct >= 80 ? '#14B446' : pct >= 40 ? '#fd7e14' : '#4e8ef7';
    return '<div class="hm-prog-bar"><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+color+';"></div></div><span style="min-width:32px;font-size:11px;font-weight:600;">'+pct+'%</span></div>';
  };

  // ── 인력 테이블 (특이사항 컬럼 제거) ─────────────────────────────
  let h = '<table>';
  h += '<thead><tr>'
     + '<th>업체</th><th>성함</th><th>공종</th>'
     + '<th>위치</th><th>진척률</th><th>공수</th>'
     + '</tr></thead><tbody>';
  for (const r of sorted) {
    const dot = '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+(VC[r.v]||'#aaa')+';margin-right:4px;vertical-align:middle;"></span>';
    const shiftBadge = r.sh === '야간'
      ? '<span style="font-size:10px;background:#e7eefc;color:#1f4e8b;padding:1px 4px;border-radius:3px;margin-left:3px;">야간</span>'
      : r.sh === '연장'
      ? '<span style="font-size:10px;background:#fff3cd;color:#856404;padding:1px 4px;border-radius:3px;margin-left:3px;">연장</span>'
      : r.sh === '반차'
      ? '<span style="font-size:10px;background:#f3e8ff;color:#6f42c1;padding:1px 4px;border-radius:3px;margin-left:3px;">반차</span>'
      : '';
    const loc = [r.floor, r.col].filter(Boolean).join(' ');
    h += '<tr>'
       + '<td style="white-space:nowrap;">'+dot+(r.vf||r.v||'─')+'</td>'
       + '<td style="white-space:nowrap;font-weight:500;">'+(r.w||'─')+'</td>'
       + '<td style="white-space:nowrap;">'+(r.c||'─')+'</td>'
       + '<td style="white-space:nowrap;font-size:11px;color:#666;">'+(loc||'─')+'</td>'
       + '<td>'+progCell(r)+'</td>'
       + '<td style="text-align:center;white-space:nowrap;">'+(r.m?r.m.toFixed(1):'─')+shiftBadge+'</td>'
       + '</tr>';
  }
  h += '</tbody></table>';

  // ── 작업 특이사항 섹션 (해당 설비 전체 기간, 날짜 오름차순) ────────
  const noteRecs = allEqRecs
    .filter(function(r){ return _isMeaningfulNote(r.note); })
    .sort(function(a,b){ return (a.d||'').localeCompare(b.d||''); });
  const VC2 = VC;
  if (noteRecs.length) {
    h += '<div style="margin-top:16px;border-top:1px solid #f0f0f0;padding-top:12px;">';
    h += '<div style="font-size:11px;font-weight:600;color:#555;margin-bottom:8px;display:flex;align-items:center;gap:6px;">'
       + '작업 특이사항 <span style="font-size:10px;color:#aaa;font-weight:400;">(전체 기간)</span>'
       + '<span style="font-size:10px;background:#fff3cd;color:#856404;padding:1px 7px;border-radius:10px;font-weight:500;">'+noteRecs.length+'건</span>'
       + '</div>';
    h += '<div style="display:flex;flex-direction:column;gap:5px;">';
    for (const r of noteRecs) {
      const inPeriod = (function(){ const k = isDay ? r.d : isoWeek(r.d); return k === col; })();
      const bg     = inPeriod ? '#f0faf3' : '#fafafa';
      const border = inPeriod ? '#14B446' : (VC2[r.v]||'#ddd');
      const dot2   = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+(VC2[r.v]||'#aaa')+';margin-right:5px;flex-shrink:0;margin-top:4px;"></span>';
      const dateTag2 = r.d ? '<span style="font-size:10px;color:#bbb;white-space:nowrap;margin-right:5px;flex-shrink:0;">'+r.d.slice(5)+'</span>' : '';
      const wTag2  = '<span style="font-size:10px;font-weight:600;color:#555;white-space:nowrap;margin-right:5px;flex-shrink:0;">'+escapeHtml(r.w||'')+'</span>';
      h += '<div style="display:flex;align-items:flex-start;background:'+bg+';border-radius:5px;padding:6px 10px;border-left:3px solid '+border+';font-size:12px;color:#444;line-height:1.5;">'
         + dot2 + dateTag2 + wTag2
         + '<span style="word-break:break-all;">'+escapeHtml(r.note).split('\n').join(' / ')+'</span>'
         + '</div>';
    }
    h += '</div></div>';
  } else {
    h += '<div style="margin-top:12px;font-size:12px;color:#bbb;text-align:center;padding:8px 0;">특이사항 없음</div>';
  }

  document.getElementById('hmModalBody').innerHTML = h;
  document.getElementById('hmModalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeHmModal() {
  document.getElementById('hmModalOverlay').style.display = 'none';

}

});

// ===== 드릴다운: KPI 클릭 / breadcrumb / 리스트 / 상세 =====

function showView(viewName, key) {
  state.view = viewName || 'main';
  state.detailKey = key || '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupKpiClicks() {
  document.querySelectorAll('.kpi-card.clickable').forEach(card => {
    card.addEventListener('click', () => {
      const target = card.dataset.target;
      if (target) showView(target);
    });
  });
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'main') { bc.style.display = 'none'; bc.innerHTML = ''; return; }
  bc.style.display = 'flex';

  const labels = {
    'list-inprogress': '진행 중 설비',
    'list-completed': '시공 완료 설비',
    'list-worker': '작업자 목록',
    'detail-equip': '설비 상세',
    'detail-worker': '작업자 상세'
  };

  const parts = [];
  parts.push('<button class="back-btn" onclick="goBack()">← 뒤로</button>');
  parts.push('<a onclick="showView(\'main\')">대시보드</a>');

  if (state.view.startsWith('detail-')) {
    const listView = state.view === 'detail-equip'
      ? (isEquipCompleted(state.detailKey) ? 'list-completed' : 'list-inprogress')
      : 'list-worker';
    parts.push('<span class="sep">›</span>');
    parts.push('<a onclick="showView(\'' + listView + '\')">' + labels[listView] + '</a>');
    parts.push('<span class="sep">›</span>');
    parts.push('<span class="current">' + escapeHtml(state.detailKey) + '</span>');
  } else {
    parts.push('<span class="sep">›</span>');
    parts.push('<span class="current">' + labels[state.view] + '</span>');
  }

  bc.innerHTML = parts.join('');
}

function goBack() {
  if (state.view.startsWith('detail-')) {
    const listView = state.view === 'detail-equip'
      ? (isEquipCompleted(state.detailKey) ? 'list-completed' : 'list-inprogress')
      : 'list-worker';
    showView(listView);
  } else {
    showView('main');
  }
}

function isEquipCompleted(equipName) {
  if (!equipName) return false;
  const data = applyFilter();
  const cMap = buildEquipCategoryMax(data).get(equipName);
  return isEquipCompletedWithMaster(equipName, cMap);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function attrJson(v) {
  return JSON.stringify(v).replace(/"/g, '&quot;');
}

function renderListInProgress(data) {
  const valid = data.filter(r => isValidEquip(r.e));
  const eqGrp = groupBy(valid, r => r.e);
  const eqCMap = buildEquipCategoryMax(valid);
  const registered = [], unregistered = [];

  for (const [eq, arr] of eqGrp) {
    const cMap = eqCMap.get(eq);
    if (isEquipCompletedWithMaster(eq, cMap)) continue;

    let totalM = 0;
    const workers = new Set();
    let lastDate = '';
    for (const r of arr) {
      totalM += (r.m || 0);
      if (r.w) workers.add(r.w);
      if (r.d && r.d > lastDate) lastDate = r.d;
    }
    const avgP = getEquipAvgPWithMaster(eq, cMap);
    const master = getEquipMasterCategories(eq);
    const masterText = master ? master.join(' / ') : (cMap && cMap.size > 0 ? Array.from(cMap.keys()).join(' / ') : '-');

    const row = { key: eq, masterText, totalM, avgP, workerCount: workers.size, lastDate };
    if (master) registered.push(row); else unregistered.push(row);
  }

  const sortByAvg = (a, b) => (b.avgP - a.avgP) || (b.totalM - a.totalM);
  registered.sort(sortByAvg);
  unregistered.sort(sortByAvg);

  let html = '';
  html += '<div class="card"><div class="card-title">진행 중 설비 — 마스터 등록 (' + registered.length + '대)</div>';
  if (registered.length === 0) {
    html += '<div class="empty-msg">표시할 설비가 없습니다.</div></div>';
  } else {
    html += renderInProgressTable(registered);
    html += '</div>';
  }

  if (unregistered.length > 0) {
    html += '<div class="card" style="margin-top:16px;"><div class="card-title">진행 중 설비 — 마스터 미등록 (' + unregistered.length + '대)</div>';
    html += '<div style="font-size:11px; color:#888; margin-bottom:8px;">⚠ _설비공종 마스터에 등록되지 않은 설비입니다. 진행률은 데이터에 등장한 공종만으로 계산됩니다.</div>';
    html += renderInProgressTable(unregistered);
    html += '</div>';
  }

  return html;
}

function renderInProgressTable(rows) {
  let html = '<div class="data-table-wrap"><table class="data-table">';
  html += '<thead><tr><th>설비명</th><th>투입 공종</th><th class="num">총 공수 (M/D)</th>';
  html += '<th>평균 진행률</th><th class="num">작업자 수</th><th>마지막 작업일</th></tr></thead><tbody>';
  for (const r of rows) {
    html += '<tr class="clickable" onclick="showView(\'detail-equip\', ' + attrJson(r.key) + ')">';
    html += '<td>' + escapeHtml(r.key) + '</td>';
    html += '<td>' + escapeHtml(r.masterText) + '</td>';
    html += '<td class="num">' + fmt(r.totalM) + '</td>';
    html += '<td><span class="progress-bar"><span style="width:' + Math.min(100, r.avgP * 100).toFixed(0) + '%"></span></span>' + pct(r.avgP) + '</td>';
    html += '<td class="num">' + r.workerCount + '</td>';
    html += '<td>' + (r.lastDate || '-') + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderListCompleted(data) {
  const valid = data.filter(r => isValidEquip(r.e));
  const eqGrp = groupBy(valid, r => r.e);
  const eqCMap = buildEquipCategoryMax(valid);
  const registered = [], unregistered = [];

  for (const [eq, arr] of eqGrp) {
    const cMap = eqCMap.get(eq);
    if (!isEquipCompletedWithMaster(eq, cMap)) continue;

    let totalM = 0, completedDate = '';
    const workers = new Set();
    for (const r of arr) {
      totalM += (r.m || 0);
      if (r.w) workers.add(r.w);
    }
    const doneRecs = arr.filter(r => typeof r.p === 'number' && r.p >= 1.0 && r.d);
    doneRecs.sort((a, b) => b.d.localeCompare(a.d));
    completedDate = doneRecs.length ? doneRecs[0].d : '';
    const master = getEquipMasterCategories(eq);
    const masterText = master ? master.join(' / ') : (cMap && cMap.size > 0 ? Array.from(cMap.keys()).join(' / ') : '-');

    const row = { key: eq, masterText, totalM, workerCount: workers.size, completedDate };
    if (master) registered.push(row); else unregistered.push(row);
  }

  const sortByDoneDate = (a, b) => (b.completedDate || '').localeCompare(a.completedDate || '') || (b.totalM - a.totalM);
  registered.sort(sortByDoneDate);
  unregistered.sort(sortByDoneDate);

  let html = '';
  html += '<div class="card"><div class="card-title">시공 완료 설비 — 마스터 등록 (' + registered.length + '대)</div>';
  if (registered.length === 0) {
    html += '<div class="empty-msg">표시할 설비가 없습니다.</div></div>';
  } else {
    html += renderCompletedTable(registered);
    html += '</div>';
  }

  if (unregistered.length > 0) {
    html += '<div class="card" style="margin-top:16px;"><div class="card-title">시공 완료 설비 — 마스터 미등록 (' + unregistered.length + '대)</div>';
    html += '<div style="font-size:11px; color:#888; margin-bottom:8px;">⚠ _설비공종 마스터에 등록되지 않은 설비입니다. 등장한 공종만 100%이면 완료로 분류됩니다.</div>';
    html += renderCompletedTable(unregistered);
    html += '</div>';
  }

  return html;
}

function renderListWorker(data) {

      totalM += (r.m || 0);
