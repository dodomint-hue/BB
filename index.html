  if (recs.length === 0) {
    html += '<div class="empty-msg">데이터가 없습니다.</div></div>';
  } else {
    html += '<div class="data-table-wrap"><table class="data-table">';
    html += '<thead><tr><th>날짜</th><th>설비명</th><th>공종</th>';
    html += '<th>진행률</th><th class="num">공수 (M/D)</th><th>서포트</th></tr></thead><tbody>';
    for (const r of recs) {
      const eqValid = isValidEquip(r.e);
      const catDisp = displayCategoryFor(r);
      html += '<tr' + (eqValid ? ' class="clickable" onclick="showView(\'detail-equip\', ' + attrJson(r.e) + ')"' : '') + '>';
      html += '<td>' + escapeHtml(r.d || '-') + '</td>';
      html += '<td>' + escapeHtml(r.e || '-') + '</td>';
      html += '<td>' + escapeHtml(catDisp) + '</td>';
      html += '<td>' + displayProgressCellHTML(r) + '</td>';
      html += '<td class="num">' + (r.m != null ? fmt(r.m) : '-') + '</td>';
      html += '<td>' + (r.s != null ? escapeHtml(String(r.s)) : '-') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
}


function renderDetailEquipCharts(data) {
  const eq = state.detailKey;
  const recs = data.filter(r => r.e === eq);

 // 1) 공종별 공수 비중 (도넛) — 5대 공종 기준
  destroyChart('detEqG');
  const gMap = new Map();
  for (const r of recs) {
    const c5 = normalizeCategory(r.c);
    if (!c5) continue;
    gMap.set(c5, (gMap.get(c5) || 0) + (r.m || 0));
  }
  const gEntries = CATEGORY_ORDER
    .map(c => [c, gMap.get(c) || 0])
    .filter(([, v]) => v > 0);
  const gCanvas = document.getElementById('chartDetEqGongjong');
  if (gCanvas && gEntries.length > 0) {
    const gTotal = gEntries.reduce((s, e) => s + e[1], 0);
    charts.detEqG = new Chart(gCanvas.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: gEntries.map(e => e[0]),
        datasets: [{ data: gEntries.map(e => e[1]),
          backgroundColor: gEntries.map(([k]) => CATEGORY_COLOR[k] || PRIMARY),
          borderWidth: 1, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 12, bottom: 12, left: 50, right: 8 } },
        radius: '72%',
        cutout: '55%',
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12, padding: 6 } },
          donutLabel: { display: true },
          tooltip: { callbacks: { label: c => {
            const p = gTotal ? Math.round(c.parsed / gTotal * 100) : 0;
            return c.label + ': ' + fmt(c.parsed) + ' M/D (' + p + '%)';
          }}}
        }
      }
    });
  }

  // 2) 업체별 공수 (세로 막대)
  destroyChart('detEqV');
  const vMap = new Map();
  for (const r of recs) {
    if (!r.v) continue;
    vMap.set(r.v, (vMap.get(r.v) || 0) + (r.m || 0));
  }
  const vEntries = VENDOR_ORDER
    .map(v => [v, vMap.get(v) || 0])
    .filter(([, val]) => val > 0);
  const vCanvas = document.getElementById('chartDetEqVendor');
  if (vCanvas && vEntries.length > 0) {
    charts.detEqV = new Chart(vCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: vEntries.map(e => VENDOR_LABEL.get(e[0]) || e[0]),
        datasets: [{ data: vEntries.map(e => e[1]),
          backgroundColor: vEntries.map((_, i) => PALETTE[i % PALETTE.length]),
          borderWidth: 0, maxBarThickness: 80 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 22 } },
        plugins: {
          legend: { display: false },
          barValue: { display: true },
          tooltip: { callbacks: { label: c => fmt(c.parsed.y) + ' M/D' } }
        },
        scales: {
          x: { ticks: { font: { size: 11 } }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }
        }
      }
    });
  }

  // 3) 작업자별 공수 (가로 막대)
  destroyChart('detEqW');
  const wMap = new Map();
  const wCatM = new Map();
  for (const r of recs) {
    if (!r.w) continue;
    wMap.set(r.w, (wMap.get(r.w) || 0) + (r.m || 0));
    const c = normalizeCategory(r.c);
    if (c) {
      if (!wCatM.has(r.w)) wCatM.set(r.w, new Map());
      const m = wCatM.get(r.w);
      m.set(c, (m.get(c) || 0) + (r.m || 0));
    }
  }
  const wEntries = Array.from(wMap.entries()).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const wLabels = wEntries.map(e => e[0]);
  const wValues = wEntries.map(e => e[1]);
  const wColors = wEntries.map(([w]) => {
    const m = wCatM.get(w);
    if (!m || m.size === 0) return PRIMARY;
    let max = -Infinity, maxC = null;
    for (const [c, v] of m) if (v > max) { max = v; maxC = c; }
    return CATEGORY_COLOR[maxC] || PRIMARY;
  });

  const WRAP_H = 420, SLOT_PX = 28, HEADER_PX = 50;
  const MIN_SLOTS = Math.floor((WRAP_H - HEADER_PX) / SLOT_PX);
  while (wLabels.length < MIN_SLOTS) { wLabels.push(''); wValues.push(null); wColors.push('rgba(0,0,0,0)'); }

  const wInner = document.getElementById('chartDetEqWorkerInner');
  if (wInner) wInner.style.height = Math.max(WRAP_H, wLabels.length * SLOT_PX + HEADER_PX) + 'px';
  const wCanvas = document.getElementById('chartDetEqWorker');
  if (wCanvas && wEntries.length > 0) {
    const xMax = wValues.reduce((a, b) => (typeof b === 'number' && b > a) ? b : a, 0) || 1;
    charts.detEqW = new Chart(wCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: wLabels,
        datasets: [{ data: wValues, backgroundColor: wColors, borderWidth: 0, maxBarThickness: 22, minBarLength: 2 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 20 } },
        plugins: {
          legend: { display: false },
          barValue: { display: true },
          tooltip: { filter: ctx => ctx.parsed.x != null,
                     callbacks: { label: c => fmt(c.parsed.x) + ' M/D' } }
        },
        scales: {
          x: { beginAtZero: true, max: xMax, display: false, grid: { color: '#f0f0f0' } },
          y: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
    renderStickyXAxis('chartDetEqWorkerAxis', 'detEqWAxis', xMax, charts.detEqW.chartArea ? charts.detEqW.chartArea.left : 0);
    requestAnimationFrame(() => {
      if (!charts.detEqW) return;
      const left = charts.detEqW.chartArea ? charts.detEqW.chartArea.left : 0;
      renderStickyXAxis('chartDetEqWorkerAxis', 'detEqWAxis', xMax, left);
    });
  }

  // 4) 주차별 평균 진행률 (마스터 분모 + 누적 max) + 목표선 (Tool In → SL2) + SL1 마커
  destroyChart('detEqWk');
  const wkCatMap = new Map();
  for (const r of recs) {
    if (typeof r.p !== 'number' || !r.d) continue;
    const c = normalizeCategory(r.c);
    if (!c) continue;
    const w = isoWeek(r.d);
    if (!w) continue;
    if (!wkCatMap.has(w)) wkCatMap.set(w, new Map());
    const cMap = wkCatMap.get(w);
    const prev = cMap.has(c) ? cMap.get(c) : -Infinity;
    if (r.p > prev) cMap.set(c, r.p);
  }
  const dataWeeks = Array.from(wkCatMap.keys()).sort();

  const schedule = EQUIP_SCHEDULE.get(eq);
  let scheduleWeeks = [];
  let wTin = null, wSL1 = null, wSL2 = null;
  let sl1Pct = null;
  if (schedule) {
    if (schedule.toolIn) wTin = isoWeek(schedule.toolIn);
    if (schedule.sl1) wSL1 = isoWeek(schedule.sl1);
    if (schedule.sl2) wSL2 = isoWeek(schedule.sl2);
    if (schedule.toolIn && schedule.sl2) {
      scheduleWeeks = isoWeeksBetween(schedule.toolIn, schedule.sl2);
      if (schedule.sl1) {
        const tinT = new Date(schedule.toolIn + 'T00:00:00Z').getTime();
        const sl1T = new Date(schedule.sl1 + 'T00:00:00Z').getTime();
        const sl2T = new Date(schedule.sl2 + 'T00:00:00Z').getTime();
        if (sl2T > tinT) sl1Pct = ((sl1T - tinT) / (sl2T - tinT)) * 100;
      }
    }
  }

  const allWeeks = Array.from(new Set([...dataWeeks, ...scheduleWeeks])).sort();
  const masterForWeek = getEquipMasterCategories(eq);
  const cumByCat = new Map();
  const weekAvg = allWeeks.map(w => {
    const cw = wkCatMap.get(w);
    if (cw) {
      for (const [c, v] of cw) {
        const prev = cumByCat.has(c) ? cumByCat.get(c) : -Infinity;
        if (v > prev) cumByCat.set(c, v);
      }
    }
    if (cumByCat.size === 0) return null;
    if (masterForWeek && masterForWeek.length > 0) {
      let total = 0;
      for (const c of masterForWeek) total += clamp01(cumByCat.has(c) ? cumByCat.get(c) : 0);
      return total / masterForWeek.length;
    }
    let total = 0;
    for (const v of cumByCat.values()) total += clamp01(v);
    return total / cumByCat.size;
  });

  let targetData = null, sl1Data = null;
  if (wTin && wSL2 && scheduleWeeks.length >= 2) {
    const startIdx = allWeeks.indexOf(wTin);
    const endIdx = allWeeks.indexOf(wSL2);
    if (startIdx >= 0 && endIdx >= 0) {
      targetData = allWeeks.map((w, i) => {
        if (i < startIdx || i > endIdx) return null;
        if (endIdx === startIdx) return 100;
        return +(((i - startIdx) / (endIdx - startIdx)) * 100).toFixed(1);
      });
      if (wSL1 && sl1Pct != null) {
        const sIdx = allWeeks.indexOf(wSL1);
        if (sIdx >= 0) {
          sl1Data = allWeeks.map(() => null);
          sl1Data[sIdx] = +sl1Pct.toFixed(1);
        }
      }
    }
  }

  const datasets = [{
    label: '평균 진행률',
    data: weekAvg.map(v => v == null ? null : +(v * 100).toFixed(1)),
    borderColor: PRIMARY,
    backgroundColor: 'rgba(46,125,50,0.1)',
    pointBackgroundColor: PRIMARY,
    pointBorderColor: '#fff',
    pointRadius: 5, pointHoverRadius: 7,
    tension: 0.3, borderWidth: 2, fill: true,
    spanGaps: true
  }];
  if (targetData) {
    datasets.push({
      label: '목표 (Tool In → SL2)',
      data: targetData,
      borderColor: '#dc3545',
      backgroundColor: 'transparent',
      pointBackgroundColor: '#dc3545',
      pointBorderColor: '#fff',
      pointRadius: 3, pointHoverRadius: 5,
      tension: 0, borderWidth: 2, borderDash: [6, 4], fill: false,
      spanGaps: true
    });
  }
  if (sl1Data) {
    datasets.push({
      label: 'SL1',
      data: sl1Data,
      borderColor: 'transparent',
      backgroundColor: '#fd7e14',
      pointBackgroundColor: '#fd7e14',
      pointBorderColor: '#fff',
      pointStyle: 'rectRot',
      pointRadius: 9, pointHoverRadius: 11,
      showLine: false, fill: false,
      spanGaps: true
    });
  }

  const wkCanvas = document.getElementById('chartDetEqWeek');
  if (wkCanvas && allWeeks.length > 0) {
    charts.detEqWk = new Chart(wkCanvas.getContext('2d'), {
      type: 'line',
      data: { labels: allWeeks, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: !!targetData, position: 'top', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
          tooltip: { callbacks: {
            label: c => {
              const lbl = c.dataset.label || '';
              if (c.parsed.y == null) return lbl + ': -';
              if (lbl === 'SL1' && schedule && schedule.sl1) return 'SL1 (' + schedule.sl1 + '): ' + c.parsed.y.toFixed(1) + '%';
              if (lbl.startsWith('목표') && schedule) {
                let extra = '';
                const w = allWeeks[c.dataIndex];
                if (w === wTin && schedule.toolIn) extra = ' — Tool In ' + schedule.toolIn;
                else if (w === wSL2 && schedule.sl2) extra = ' — SL2 ' + schedule.sl2;
                return lbl + ': ' + c.parsed.y.toFixed(1) + '%' + extra;
              }
              return lbl + ': ' + c.parsed.y.toFixed(1) + '%';
            }
          }}
        },
        scales: {
          x: { ticks: { font: { size: 11 } }, grid: { color: '#f0f0f0' } },
          y: {
            beginAtZero: true, max: 100,
            ticks: { font: { size: 10 }, stepSize: 25, callback: v => v + '%' },
            grid: { color: '#f0f0f0' }
          }
        }
      }
    });
  }
}

function renderDetailWorkerCharts(data) {
  const wk = state.detailKey;
  const recs = data.filter(r => r.w === wk);

  destroyChart('detWkE');
  const eMap = new Map();
  for (const r of recs) {
    if (!isValidEquip(r.e)) continue;
    eMap.set(r.e, (eMap.get(r.e) || 0) + (r.m || 0));
  }
  const eEntries = Array.from(eMap.entries()).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const eLabels = eEntries.map(e => e[0]);
  const eValues = eEntries.map(e => e[1]);
  const eColors = eEntries.map((_, i) => PALETTE[i % PALETTE.length]);

  const WRAP_H = 420, SLOT_PX = 28, HEADER_PX = 50;
  const MIN_SLOTS = Math.floor((WRAP_H - HEADER_PX) / SLOT_PX);
  while (eLabels.length < MIN_SLOTS) { eLabels.push(''); eValues.push(null); eColors.push('rgba(0,0,0,0)'); }

  const inner = document.getElementById('chartDetWkEquipInner');
  if (inner) inner.style.height = Math.max(WRAP_H, eLabels.length * SLOT_PX + HEADER_PX) + 'px';

  const eCanvas = document.getElementById('chartDetWkEquip');
  if (eCanvas && eEntries.length > 0) {
    const xMax = eValues.reduce((a, b) => (typeof b === 'number' && b > a) ? b : a, 0) || 1;
    charts.detWkE = new Chart(eCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: eLabels,
        datasets: [{ data: eValues, backgroundColor: eColors, borderWidth: 0, maxBarThickness: 22, minBarLength: 2 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 20 } },
        plugins: {
          legend: { display: false },
          barValue: { display: true },
          tooltip: { filter: ctx => ctx.parsed.x != null,
                     callbacks: { label: c => fmt(c.parsed.x) + ' M/D' } }
        },
        scales: {
          x: { beginAtZero: true, max: xMax, display: false, grid: { color: '#f0f0f0' } },
          y: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
    renderStickyXAxis('chartDetWkEquipAxis', 'detWkEAxis', xMax, charts.detWkE.chartArea ? charts.detWkE.chartArea.left : 0);
    requestAnimationFrame(() => {
      if (!charts.detWkE) return;
      const left = charts.detWkE.chartArea ? charts.detWkE.chartArea.left : 0;
      renderStickyXAxis('chartDetWkEquipAxis', 'detWkEAxis', xMax, left);
    });
  }
}

function render() {
  const data = applyFilter();
  document.getElementById('recordCount').textContent = data.length;
  rebuildFilterOptions();
  renderKPI(data);
  renderBreadcrumb();

  const mainView = document.getElementById('mainView');
  const detailView = document.getElementById('detailView');

  if (state.view === 'main') {
    mainView.style.display = '';
    detailView.style.display = 'none';
    detailView.innerHTML = '';
    renderCategory(applyFilter('category'));
    renderVendor(applyFilter('vendor', 'worker'));
    renderHeatmap(data);
    renderNotes(data);
    // 설비 검색 시 TOP 10 카드 숨김
    const top10Card = document.getElementById('chartTop10Card');
    if (state.equip.trim()) {
      if (top10Card) top10Card.style.display = 'none';
      destroyChart('top10');
    } else {
      if (top10Card) top10Card.style.display = '';
      renderTop10(data);
    }
  } else {
    mainView.style.display = 'none';
    // 메인 차트 destroy (캔버스 hidden 상태에서 누적되지 않도록)
    destroyChart('cat'); destroyChart('ven'); destroyChart('top10');
    detailView.style.display = '';
    let html = '';
    switch (state.view) {
      case 'list-inprogress': html = renderListInProgress(data); break;
      case 'list-completed':  html = renderListCompleted(data); break;
      case 'list-worker':     html = renderListWorker(data); break;
      case 'detail-equip':    html = renderDetailEquip(data); break;
      case 'detail-worker':   html = renderDetailWorker(data); break;
    }
    detailView.innerHTML = html;
    // 상세 차트 후처리
    if (state.view === 'detail-equip') renderDetailEquipCharts(data);
    else if (state.view === 'detail-worker') renderDetailWorkerCharts(data);
    else {
      destroyChart('detEqG'); destroyChart('detEqV'); destroyChart('detEqW'); destroyChart('detEqWk'); destroyChart('detWkE');
    }
  }
}

renderDailyCompare(_stored, cstToday(), cstToday());
document.getElementById('exportedAt').textContent = '데이터 기준: ' + (RAW.meta.exported_at || '-');
document.getElementById('recordTotal').textContent = RAW.records.length;
setupFilters();
setupKpiClicks();
render();
renderNotes(_stored);
</script>
