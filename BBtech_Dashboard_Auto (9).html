function renderHeatmap(data) {
  const wrap = document.getElementById('heatmap');
  wrap.innerHTML = '';

  const valid = data.filter(r => isValidEquip(r.e));
  if (valid.length === 0) {
    wrap.innerHTML = '<div class="empty-msg">표시할 데이터가 없습니다.</div>';
    return;
  }

  const byMD = groupBy(valid, r => r.e);
  // 전체 설비 목록 (공수 > 0)
  const allEqMD = Array.from(byMD.entries())
    .map(([k, arr]) => [k, sum(arr, r => r.m || 0)])
    .filter(([, v]) => v > 0);
  if (!allEqMD.length) {
    wrap.innerHTML = '<div class="empty-msg">표시할 데이터가 없습니다.</div>';
    return;
  }

  // ── 컬럼(시간축) 계산 ────────────────────────────────────────────────
  const isDay = hmState.mode === 'day';
  const colKey = isDay ? (r => r.d) : (r => isoWeek(r.d));
  const colSet = new Set();
  for (const r of valid) {
    if (!normalizeCategory(r.c)) continue;
    const k = colKey(r);
    if (k) colSet.add(k);
  }
  const cols = Array.from(colSet).sort();

  if (!cols.length) {
    wrap.innerHTML = '<div class="empty-msg">표시할 데이터가 없습니다.</div>';
    return;
  }

  // ── 설비별 × 컬럼별 누적 max 평균 계산 ──────────────────────────────
  const allEqIds = allEqMD.map(e => e[0]);
  const eqColCat = new Map();
  for (const eq of allEqIds) eqColCat.set(eq, new Map());
  for (const r of valid) {
    if (!eqColCat.has(r.e)) continue;
    if (typeof r.p !== 'number') continue;
    const c = normalizeCategory(r.c);
    if (!c) continue;
    const k = colKey(r);
    if (!k) continue;
    const cMap = eqColCat.get(r.e);
    if (!cMap.has(k)) cMap.set(k, new Map());
    const prev = cMap.get(k).get(c) ?? -Infinity;
    if (r.p > prev) cMap.get(k).set(c, r.p);
  }

  const cellMap = new Map();
  for (const eq of allEqIds) {
    cellMap.set(eq, new Map());
    const cMap = eqColCat.get(eq);
    const cum = new Map();
    for (const col of cols) {
      const cw = cMap.get(col);
      if (cw) for (const [c,v] of cw) { if (v > (cum.get(c)??-Infinity)) cum.set(c,v); }
      const master = getEquipMasterCategories(eq);
      let avg = 0;
      if (master && master.length > 0) {
        let tot = 0;
        for (const c of master) tot += clamp01(cum.has(c) ? cum.get(c) : 0);
        avg = tot / master.length;
      } else if (cum.size > 0) {
        let tot = 0;
        for (const v of cum.values()) tot += clamp01(v);
        avg = tot / cum.size;
      }
      cellMap.get(eq).set(col, avg);
    }
  }

  // ── 마지막 컬럼 진척률 계산 (정렬용) ─────────────────────────────────
  const lastCol = cols[cols.length - 1];
  const getLatestP = eq => cellMap.get(eq)?.get(lastCol) ?? 0;
  const getMD      = eq => allEqMD.find(([k])=>k===eq)?.[1] ?? 0;

  let sortedEq;
  if (hmState.sort === 'asc')  sortedEq = [...allEqIds].sort((a,b) => getLatestP(a) - getLatestP(b));
  else if (hmState.sort === 'desc') sortedEq = [...allEqIds].sort((a,b) => getLatestP(b) - getLatestP(a));
  else sortedEq = [...allEqIds].sort((a,b) => getMD(b) - getMD(a));

  // ── 범례 노트 ─────────────────────────────────────────────────────────
  const noteEl = document.getElementById('hmLegendNote');
  if (noteEl) {
    const sortLabel = hmState.sort==='asc' ? '진척률 오름차순' : hmState.sort==='desc' ? '진척률 내림차순' : '공수 내림차순';
    const modeLabel = isDay ? '일별' : '주차별';
    noteEl.textContent = modeLabel + ' · ' + sortLabel + ' · ' + sortedEq.length + '개 설비';
  }

  // ── 그리드 렌더 ──────────────────────────────────────────────────────
  const grid = document.createElement('div');
  grid.className = 'heatmap';
  // 일별 모드는 컬럼 너비 좁게
  const colW = isDay ? 'minmax(28px,36px)' : 'minmax(38px,auto)';
  grid.style.gridTemplateColumns = 'minmax(110px,180px) repeat(' + cols.length + ', ' + colW + ')';

  // 코너 + 헤더
  const corner = document.createElement('div');
  corner.className = 'hm-cell hm-corner';
  corner.textContent = isDay ? '날짜 →' : '주차 →';
  corner.style.cssText += 'font-size:10px;color:#aaa;font-weight:400;';
  grid.appendChild(corner);
  for (const col of cols) {
    const c = document.createElement('div');
    c.className = 'hm-cell hm-col-label';
    // 일별: MM/DD 형식으로 짧게
    c.textContent = isDay ? col.slice(5).replace('-','/') : col;
    c.title = col;
    grid.appendChild(c);
  }

  // 데이터 행
  for (const eq of sortedEq) {
    const latestP = getLatestP(eq);
    const label = document.createElement('div');
    label.className = 'hm-cell hm-row-label';
    label.textContent = eq;
    label.title = eq + ' — 현재 ' + Math.round(latestP*100) + '%';
    // 진척률 정렬 모드일 때 행 레이블에 % 배지 표시
    if (hmState.sort !== 'md') {
      const badge = document.createElement('span');
      badge.style.cssText = 'margin-left:4px;font-size:9px;padding:1px 4px;border-radius:3px;background:#e8f5e9;color:#2E7D32;font-weight:600;';
      badge.textContent = Math.round(latestP*100)+'%';
      label.appendChild(badge);
    }
    grid.appendChild(label);

    const wkMap = cellMap.get(eq);
    for (const col of cols) {
      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      const avg = wkMap?.has(col) ? wkMap.get(col) : 0;
      const display = Math.round(avg * 100);
      // 값이 없는 셀은 빈칸
      if (avg === 0) {
        cell.textContent = '';
        cell.style.background = '#f8f9fa';
        cell.style.color = '#ccc';
      } else {
        cell.textContent = display;
        cell.style.background = heatColor(avg);
        cell.style.color = clamp01(avg) > 0.5 ? '#fff' : '#003C1E';
      }
      cell.title = eq + ' / ' + col + ': ' + display + '%  (클릭하면 세부 내역 표시)';
      if (avg > 0) {
        cell.classList.add('clickable');
        (function(e2, c2, cl2) {
          cell.addEventListener('click', function() {
            openHmModal(e2, c2, cl2, applyFilter());
          });
        })(eq, col, col);
      }
      grid.appendChild(cell);
    }
  }
  wrap.appendChild(grid);
}


// ── 히트맵 셀 클릭 모달 ─────────────────────────────────────────────
// ── 특이사항 필터: 없음·단순지원 제외 ────────────────────────────────
function _isMeaningfulNote(note) {
  if (!note) return false;
  const t = note.trim();
  // 빈값·없음·x 류
  if (/^[없xX\s-]{0,5}$/.test(t)) return false;
  if (/^없[음은]$/.test(t)) return false;
  // 단순 지원 패턴: 이름/팀 + 지원 으로만 구성된 짧은 문장
  // "김민성팀 지원", "박상영 배관사 지원", "조국희팀 지원", "이성운 배관사 지원"
  if (t.length <= 30 && /지원\s*$/.test(t) &&
      !/비계|간섭|미반입|미입고|루트|수정|설치불가|로스|대기|완료|변경|확인|방문|측정|실측|불량|타공|용접|작업/.test(t)) {
    return false;
  }
  return true;
}

function openHmModal(eq, col, colLabel, allData) {
  const isDay = hmState.mode === 'day';
  // 인력 테이블: 클릭한 기간의 레코드만
  const recs = allData.filter(function(r) {
    if (r.e !== eq) return false;
    if (!r.d) return false;
    const k = isDay ? r.d : isoWeek(r.d);
    return k === col;
  });
  // 특이사항: 해당 설비의 전체 기간 레코드 (일별 모드에서도 모두 표시)
  const allEqRecs = allData.filter(function(r) {
    return r.e === eq && r.d;
  });

  if (!recs.length) {
    alert('해당 기간에 데이터가 없습니다.');
    return;
  }

  document.getElementById('hmModalTitle').textContent = eq;
  document.getElementById('hmModalSub').textContent =
    (isDay ? col : col + ' (' + colLabel + ')') +
    '  ·  작업자 ' + new Set(recs.filter(r=>r.w).map(r=>r.w)).size + '명  ·  ' +
    recs.length + '건';

  const sorted = recs.slice().sort(function(a,b) {
    const vc = (a.v||'').localeCompare(b.v||'', 'ko');
    if (vc !== 0) return vc;
    return (a.w||'').localeCompare(b.w||'', 'ko');
  });

  const VC = {'주민':'#2E7D32','동영':'#fd7e14','새로':'#4e8ef7','제이엠':'#6f42c1'};

  const progCell = function(r) {
    if (r.c === '용접사') {
      return r.wp ? '<span style="font-size:11px;background:#fff3cd;color:#856404;padding:1px 5px;border-radius:3px;">' + r.wp + ' pt</span>' : '─';
    }
    if (typeof r.p !== 'number') return '─';
    const pct = Math.min(100, Math.round(r.p * 100));
    const color = pct >= 80 ? '#14B446' : pct >= 40 ? '#fd7e14' : '#4e8ef7';
    return '<div class="hm-prog-bar"><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+color+';"></div></div><span style="min-width:32px;font-size:11px;font-weight:600;">'+pct+'%</span></div>';
  };

  // ── 인력 테이블 (특이사항 컬럼 제거) ─────────────────────────────
  let h = '<table>';
  h += '<thead><tr>'
     + '<th>업체</th><th>성함</th><th>공종</th>'
     + '<th>위치</th><th>진척률</th><th>공수</th>'
     + '</tr></thead><tbody>';
  for (const r of sorted) {
    const dot = '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+(VC[r.v]||'#aaa')+';margin-right:4px;vertical-align:middle;"></span>';
    const shiftBadge = r.m === 1.25
      ? '<span style="font-size:10px;background:#fff3cd;color:#856404;padding:1px 4px;border-radius:3px;margin-left:3px;">+2hr</span>'
      : r.m === 0.5
      ? '<span style="font-size:10px;background:#f3e8ff;color:#6f42c1;padding:1px 4px;border-radius:3px;margin-left:3px;">반차</span>'
      : '';
    const loc = [r.floor, r.col].filter(Boolean).join(' ');
    h += '<tr>'
       + '<td style="white-space:nowrap;">'+dot+(r.vf||r.v||'─')+'</td>'
       + '<td style="white-space:nowrap;font-weight:500;">'+(r.w||'─')+'</td>'
       + '<td style="white-space:nowrap;">'+(r.c||'─')+'</td>'
       + '<td style="white-space:nowrap;font-size:11px;color:#666;">'+(loc||'─')+'</td>'
       + '<td>'+progCell(r)+'</td>'
       + '<td style="text-align:center;white-space:nowrap;">'+(r.m?r.m.toFixed(1):'─')+shiftBadge+'</td>'
       + '</tr>';
  }
  h += '</tbody></table>';

  // ── 작업 특이사항 섹션 (해당 설비 전체 기간, 날짜 오름차순) ────────
  const noteRecs = allEqRecs
    .filter(function(r){ return _isMeaningfulNote(r.note); })
    .sort(function(a,b){ return (a.d||'').localeCompare(b.d||''); });
  const VC2 = VC;
  if (noteRecs.length) {
    h += '<div style="margin-top:16px;border-top:1px solid #f0f0f0;padding-top:12px;">';
    h += '<div style="font-size:11px;font-weight:600;color:#555;margin-bottom:8px;display:flex;align-items:center;gap:6px;">'
       + '작업 특이사항 <span style="font-size:10px;color:#aaa;font-weight:400;">(전체 기간)</span>'
       + '<span style="font-size:10px;background:#fff3cd;color:#856404;padding:1px 7px;border-radius:10px;font-weight:500;">'+noteRecs.length+'건</span>'
       + '</div>';
    h += '<div style="display:flex;flex-direction:column;gap:5px;">';
    for (const r of noteRecs) {
      const inPeriod = (function(){ const k = isDay ? r.d : isoWeek(r.d); return k === col; })();
      const bg     = inPeriod ? '#f0faf3' : '#fafafa';
      const border = inPeriod ? '#14B446' : (VC2[r.v]||'#ddd');
      const dot2   = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+(VC2[r.v]||'#aaa')+';margin-right:5px;flex-shrink:0;margin-top:4px;"></span>';
      const dateTag2 = r.d ? '<span style="font-size:10px;color:#bbb;white-space:nowrap;margin-right:5px;flex-shrink:0;">'+r.d.slice(5)+'</span>' : '';
      const wTag2  = '<span style="font-size:10px;font-weight:600;color:#555;white-space:nowrap;margin-right:5px;flex-shrink:0;">'+escapeHtml(r.w||'')+'</span>';
      h += '<div style="display:flex;align-items:flex-start;background:'+bg+';border-radius:5px;padding:6px 10px;border-left:3px solid '+border+';font-size:12px;color:#444;line-height:1.5;">'
         + dot2 + dateTag2 + wTag2
         + '<span style="word-break:break-all;">'+escapeHtml(r.note).split('\n').join(' / ')+'</span>'
         + '</div>';
    }
    h += '</div></div>';
  } else {
    h += '<div style="margin-top:12px;font-size:12px;color:#bbb;text-align:center;padding:8px 0;">특이사항 없음</div>';
  }

  document.getElementById('hmModalBody').innerHTML = h;
  document.getElementById('hmModalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeHmModal() {
  document.getElementById('hmModalOverlay').style.display = 'none';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeHmModal();
});

// ===== 드릴다운: KPI 클릭 / breadcrumb / 리스트 / 상세 =====

function showView(viewName, key) {
  state.view = viewName || 'main';
  state.detailKey = key || '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupKpiClicks() {
  document.querySelectorAll('.kpi-card.clickable').forEach(card => {
    card.addEventListener('click', () => {
      const target = card.dataset.target;
      if (target) showView(target);
    });
  });
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'main') { bc.style.display = 'none'; bc.innerHTML = ''; return; }
  bc.style.display = 'flex';

  const labels = {
    'list-inprogress': '진행 중 설비',
    'list-completed': '시공 완료 설비',
    'list-worker': '작업자 목록',
    'detail-equip': '설비 상세',
    'detail-worker': '작업자 상세'
  };

  const parts = [];
  parts.push('<button class="back-btn" onclick="goBack()">← 뒤로</button>');
  parts.push('<a onclick="showView(\'main\')">대시보드</a>');

  if (state.view.startsWith('detail-')) {
    const listView = state.view === 'detail-equip'
      ? (isEquipCompleted(state.detailKey) ? 'list-completed' : 'list-inprogress')
      : 'list-worker';
    parts.push('<span class="sep">›</span>');
    parts.push('<a onclick="showView(\'' + listView + '\')">' + labels[listView] + '</a>');
    parts.push('<span class="sep">›</span>');
    parts.push('<span class="current">' + escapeHtml(state.detailKey) + '</span>');
  } else {
    parts.push('<span class="sep">›</span>');
    parts.push('<span class="current">' + labels[state.view] + '</span>');
  }

  bc.innerHTML = parts.join('');
}

function goBack() {
  if (state.view.startsWith('detail-')) {
    const listView = state.view === 'detail-equip'
      ? (isEquipCompleted(state.detailKey) ? 'list-completed' : 'list-inprogress')
      : 'list-worker';
    showView(listView);
  } else {
    showView('main');
  }
}

function isEquipCompleted(equipName) {
  if (!equipName) return false;
  const data = applyFilter();
  const cMap = buildEquipCategoryMax(data).get(equipName);
  return isEquipCompletedWithMaster(equipName, cMap);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function attrJson(v) {
  return JSON.stringify(v).replace(/"/g, '&quot;');
}

function renderListInProgress(data) {
  const valid = data.filter(r => isValidEquip(r.e));
  const eqGrp = groupBy(valid, r => r.e);
  const eqCMap = buildEquipCategoryMax(valid);
  const registered = [], unregistered = [];

  for (const [eq, arr] of eqGrp) {
    const cMap = eqCMap.get(eq);
    if (isEquipCompletedWithMaster(eq, cMap)) continue;

    let totalM = 0;
    const workers = new Set();
    let lastDate = '';
    for (const r of arr) {
      totalM += (r.m || 0);
      if (r.w) workers.add(r.w);
      if (r.d && r.d > lastDate) lastDate = r.d;
    }
    const avgP = getEquipAvgPWithMaster(eq, cMap);
    const master = getEquipMasterCategories(eq);
    const masterText = master ? master.join(' / ') : (cMap && cMap.size > 0 ? Array.from(cMap.keys()).join(' / ') : '-');

    const row = { key: eq, masterText, totalM, avgP, workerCount: workers.size, lastDate };
    if (master) registered.push(row); else unregistered.push(row);
  }

  const sortByAvg = (a, b) => (b.avgP - a.avgP) || (b.totalM - a.totalM);
  registered.sort(sortByAvg);
  unregistered.sort(sortByAvg);

  let html = '';
  html += '<div class="card"><div class="card-title">진행 중 설비 — 마스터 등록 (' + registered.length + '대)</div>';
  if (registered.length === 0) {
    html += '<div class="empty-msg">표시할 설비가 없습니다.</div></div>';
  } else {
    html += renderInProgressTable(registered);
    html += '</div>';
  }

  if (unregistered.length > 0) {
    html += '<div class="card" style="margin-top:16px;"><div class="card-title">진행 중 설비 — 마스터 미등록 (' + unregistered.length + '대)</div>';
    html += '<div style="font-size:11px; color:#888; margin-bottom:8px;">⚠ _설비공종 마스터에 등록되지 않은 설비입니다. 진행률은 데이터에 등장한 공종만으로 계산됩니다.</div>';
    html += renderInProgressTable(unregistered);
    html += '</div>';
  }

  return html;
}

function renderInProgressTable(rows) {
  let html = '<div class="data-table-wrap"><table class="data-table">';
  html += '<thead><tr><th>설비명</th><th>투입 공종</th><th class="num">총 공수 (M/D)</th>';
  html += '<th>평균 진행률</th><th class="num">작업자 수</th><th>마지막 작업일</th></tr></thead><tbody>';
  for (const r of rows) {
    html += '<tr class="clickable" onclick="showView(\'detail-equip\', ' + attrJson(r.key) + ')">';
    html += '<td>' + escapeHtml(r.key) + '</td>';
    html += '<td>' + escapeHtml(r.masterText) + '</td>';
    html += '<td class="num">' + fmt(r.totalM) + '</td>';
    html += '<td><span class="progress-bar"><span style="width:' + Math.min(100, r.avgP * 100).toFixed(0) + '%"></span></span>' + pct(r.avgP) + '</td>';
    html += '<td class="num">' + r.workerCount + '</td>';
    html += '<td>' + (r.lastDate || '-') + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderListCompleted(data) {
  const valid = data.filter(r => isValidEquip(r.e));
  const eqGrp = groupBy(valid, r => r.e);
  const eqCMap = buildEquipCategoryMax(valid);
  const registered = [], unregistered = [];

  for (const [eq, arr] of eqGrp) {
    const cMap = eqCMap.get(eq);
    if (!isEquipCompletedWithMaster(eq, cMap)) continue;

    let totalM = 0, completedDate = '';
    const workers = new Set();
    for (const r of arr) {
      totalM += (r.m || 0);
      if (r.w) workers.add(r.w);
    }
    const doneRecs = arr.filter(r => typeof r.p === 'number' && r.p >= 1.0 && r.d);
    doneRecs.sort((a, b) => b.d.localeCompare(a.d));
    completedDate = doneRecs.length ? doneRecs[0].d : '';
    const master = getEquipMasterCategories(eq);
    const masterText = master ? master.join(' / ') : (cMap && cMap.size > 0 ? Array.from(cMap.keys()).join(' / ') : '-');

    const row = { key: eq, masterText, totalM, workerCount: workers.size, completedDate };
    if (master) registered.push(row); else unregistered.push(row);
  }

  const sortByDoneDate = (a, b) => (b.completedDate || '').localeCompare(a.completedDate || '') || (b.totalM - a.totalM);
  registered.sort(sortByDoneDate);
  unregistered.sort(sortByDoneDate);

  let html = '';
  html += '<div class="card"><div class="card-title">시공 완료 설비 — 마스터 등록 (' + registered.length + '대)</div>';
  if (registered.length === 0) {
    html += '<div class="empty-msg">표시할 설비가 없습니다.</div></div>';
  } else {
    html += renderCompletedTable(registered);
    html += '</div>';
  }

  if (unregistered.length > 0) {
    html += '<div class="card" style="margin-top:16px;"><div class="card-title">시공 완료 설비 — 마스터 미등록 (' + unregistered.length + '대)</div>';
    html += '<div style="font-size:11px; color:#888; margin-bottom:8px;">⚠ _설비공종 마스터에 등록되지 않은 설비입니다. 등장한 공종만 100%이면 완료로 분류됩니다.</div>';
    html += renderCompletedTable(unregistered);
    html += '</div>';
  }

  return html;
}

function renderCompletedTable(rows) {
  let html = '<div class="data-table-wrap"><table class="data-table">';
  html += '<thead><tr><th>설비명</th><th>투입 공종</th><th class="num">총 공수 (M/D)</th>';
  html += '<th class="num">작업자 수</th><th>완료일</th><th>상태</th></tr></thead><tbody>';
  for (const r of rows) {
    html += '<tr class="clickable" onclick="showView(\'detail-equip\', ' + attrJson(r.key) + ')">';
    html += '<td>' + escapeHtml(r.key) + '</td>';
    html += '<td>' + escapeHtml(r.masterText) + '</td>';
    html += '<td class="num">' + fmt(r.totalM) + '</td>';
    html += '<td class="num">' + r.workerCount + '</td>';
    html += '<td>' + (r.completedDate || '-') + '</td>';
    html += '<td><span class="badge completed">완료</span></td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}
function renderListWorker(data) {
  const wkGrp = groupBy(data.filter(r => r.w), r => r.w);
  const rows = [];
  for (const [w, arr] of wkGrp) {
    let totalM = 0, vendor = '', vendorFull = '';
    let firstDate = '', lastDate = '';
    const equips = new Set();
    const catSet = new Set();
    for (const r of arr) {
      totalM += (r.m || 0);
      if (!vendor && r.v) { vendor = r.v; vendorFull = r.vf || r.v; }
      const c5 = normalizeCategory(r.c);
      if (c5) catSet.add(c5);
      else if (r.c) catSet.add(String(r.c));
      if (r.d) {
        if (!firstDate || r.d < firstDate) firstDate = r.d;
        if (r.d > lastDate) lastDate = r.d;
      }
      if (isValidEquip(r.e)) equips.add(r.e);
    }
    const c5sorted = CATEGORY_ORDER.filter(c => catSet.has(c));
    const others = Array.from(catSet).filter(c => !CATEGORY_ORDER.includes(c)).sort();
    const catText = [...c5sorted, ...others].join(' / ') || '-';
    rows.push({ key: w, vendor, vendorFull, catText, totalM, equipCount: equips.size, firstDate, lastDate });
  }
  rows.sort((a, b) => a.key.localeCompare(b.key, 'ko'));

  let html = '<div class="card"><div class="card-title">작업자 목록 (' + rows.length + '명)</div>';
  if (rows.length === 0) {
    html += '<div class="empty-msg">표시할 작업자가 없습니다.</div></div>';
  } else {
    html += '<div class="data-table-wrap"><table class="data-table">';
    html += '<thead><tr><th>이름</th><th>업체</th><th>공종</th>';
    html += '<th class="num">총 공수 (M/D)</th><th class="num">투입 설비</th><th>최초 작업일</th><th>마지막 작업일</th></tr></thead><tbody>';
    for (const r of rows) {
      html += '<tr class="clickable" onclick="showView(\'detail-worker\', ' + attrJson(r.key) + ')">';
      html += '<td>' + escapeHtml(r.key) + '</td>';
      html += '<td>' + escapeHtml(r.vendorFull || r.vendor) + '</td>';
      html += '<td>' + escapeHtml(r.catText) + '</td>';
      html += '<td class="num">' + fmt(r.totalM) + '</td>';
      html += '<td class="num">' + r.equipCount + '</td>';
      html += '<td>' + (r.firstDate || '-') + '</td>';
      html += '<td>' + (r.lastDate || '-') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
}

function renderDetailEquip(data) {
  const eq = state.detailKey;
  const recs = data.filter(r => r.e === eq);
  recs.sort((a, b) => (a.d || '').localeCompare(b.d || ''));

  let totalM = 0, category = '';
  const workers = new Set();
  for (const r of recs) {
    totalM += (r.m || 0);
    if (r.w) workers.add(r.w);
    if (!category && r.c) category = normalizeCategory(r.c) || r.c;
  }
  const cMap = buildEquipCategoryMax(recs).get(eq);
  const gMap = buildEquipGongjongMax(recs).get(eq);
  const isDone = isEquipCompletedWithMaster(eq, cMap);
  const avgP = getEquipAvgPWithMaster(eq, cMap);
  const masterCats = getEquipMasterCategories(eq);
  const status = isDone ? '시공 완료' : '진행 중';
  const statusClass = isDone ? 'completed' : '';

  let html = '<div class="detail-header">';
  html += '<div class="title-row">';
  html += '<h2>' + escapeHtml(eq) + '</h2>';
  html += '<span class="badge ' + statusClass + '">' + status + '</span>';
  html += '<span class="subtitle">' + escapeHtml(category) + '</span>';
  html += '</div>';
  html += '<div class="stat-row">';
  html += '<div class="stat"><div class="lbl">총 공수</div><div class="val">' + fmt(totalM) + ' M/D</div></div>';
  html += '<div class="stat"><div class="lbl">평균 진행률</div><div class="val">' + pct(avgP) + '</div></div>';
  if (masterCats) {
    html += '<div class="stat"><div class="lbl">적용 공종 (마스터)</div><div class="val" style="font-size:13px;">' + escapeHtml(masterCats.join(' / ')) + '</div></div>';
  } else {

  html += '</div>';

  html += '<div class="card" style="margin-top:16px;"><div class="card-title">작업 이력 (날짜순)</div>';

    html += '<thead><tr><th>날짜</th><th>업체</th><th>작업자</th><th>공종</th>';
    html += '<th>진행률</th><th class="num">공수 (M/D)</th><th>서포트</th></tr></thead><tbody>';

      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
}

function renderDetailWorker(data) {
  const wk = state.detailKey;
  const recs = data.filter(r => r.w === wk);
  recs.sort((a, b) => (b.d || '').localeCompare(a.d || ''));

  let totalM = 0, vendor = '', vendorFull = '';
  let firstDate = '', lastDate = '';
  const equips = new Set();
  const catSet = new Set();
  for (const r of recs) {
    totalM += (r.m || 0);
    if (!vendor && r.v) { vendor = r.v; vendorFull = r.vf || r.v; }
    const c5 = normalizeCategory(r.c);
    if (c5) catSet.add(c5);
    else if (r.c) catSet.add(String(r.c));
    if (isValidEquip(r.e)) equips.add(r.e);
    if (r.d) {
      if (!firstDate || r.d < firstDate) firstDate = r.d;
      if (r.d > lastDate) lastDate = r.d;
    }
  }
  const c5sorted = CATEGORY_ORDER.filter(c => catSet.has(c));
  const others = Array.from(catSet).filter(c => !CATEGORY_ORDER.includes(c)).sort();
  const catText = [...c5sorted, ...others].join(' / ') || '-';

  let html = '<div class="detail-header">';
  html += '<div class="title-row">';
  html += '<h2>' + escapeHtml(wk) + '</h2>';
  html += '<span class="subtitle">' + escapeHtml(vendorFull) + ' / ' + escapeHtml(catText) + '</span>';
  html += '</div>';
  html += '<div class="stat-row">';
  html += '<div class="stat"><div class="lbl">총 공수</div><div class="val">' + fmt(totalM) + ' M/D</div></div>';
  html += '<div class="stat"><div class="lbl">투입 설비</div><div class="val">' + equips.size + '대</div></div>';
  html += '<div class="stat"><div class="lbl">작업 이력</div><div class="val">' + recs.length + '건</div></div>';
  html += '<div class="stat"><div class="lbl">근무 기간</div><div class="val" style="font-size:13px;">' +
    (firstDate ? (firstDate + ' ~ ' + lastDate) : '-') + '</div></div>';
  html += '</div></div>';

  html += '<div class="card" style="margin-top:16px;"><div class="card-title">설비별 공수</div><div class="chart-scroll-wrap"><div class="chart-scroll-inner" id="chartDetWkEquipInner"><canvas id="chartDetWkEquip"></canvas></div><div class="x-axis-fixed"><canvas id="chartDetWkEquipAxis"></canvas></div></div></div>';

  html += '<div class="card" style="margin-top:16px;"><div class="card-title">작업 이력 (날짜순)</div>';
  if (recs.length === 0) {
    html += '<div class="empty-msg">데이터가 없습니다.</div></div>';
  } else {
    html += '<div class="data-table-wrap"><table class="data-table">';
    html += '<thead><tr><th>날짜</th><th>설비명</th><th>공종</th>';
    html += '<th>진행률</th><th class="num">공수 (M/D)</th><th>서포트</th></tr></thead><tbody>';
    for (const r of recs) {
      const eqValid = isValidEquip(r.e);
      const catDisp = displayCategoryFor(r);
      html += '<tr' + (eqValid ? ' class="clickable" onclick="showView(\'detail-equip\', ' + attrJson(r.e) + ')"' : '') + '>';
      html += '<td>' + escapeHtml(r.d || '-') + '</td>';
      html += '<td>' + escapeHtml(r.e || '-') + '</td>';
      html += '<td>' + escapeHtml(catDisp) + '</td>';
      html += '<td>' + displayProgressCellHTML(r) + '</td>';
      html += '<td class="num">' + (r.m != null ? fmt(r.m) : '-') + '</td>';
      html += '<td>' + (r.s != null ? escapeHtml(String(r.s)) : '-') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
}


function renderDetailEquipCharts(data) {
  const eq = state.detailKey;
  const recs = data.filter(r => r.e === eq);

 // 1) 공종별 공수 비중 (도넛) — 5대 공종 기준
  destroyChart('detEqG');
  const gMap = new Map();
  for (const r of recs) {
    const c5 = normalizeCategory(r.c);
    if (!c5) continue;
    gMap.set(c5, (gMap.get(c5) || 0) + (r.m || 0));
  }
  const gEntries = CATEGORY_ORDER
    .map(c => [c, gMap.get(c) || 0])
    .filter(([, v]) => v > 0);
  const gCanvas = document.getElementById('chartDetEqGongjong');
  if (gCanvas && gEntries.length > 0) {
    const gTotal = gEntries.reduce((s, e) => s + e[1], 0);
    charts.detEqG = new Chart(gCanvas.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: gEntries.map(e => e[0]),
        datasets: [{ data: gEntries.map(e => e[1]),
          backgroundColor: gEntries.map(([k]) => CATEGORY_COLOR[k] || PRIMARY),
          borderWidth: 1, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 12, bottom: 12, left: 50, right: 8 } },
        radius: '72%',
        cutout: '55%',
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12, padding: 6 } },
          donutLabel: { display: true },
          tooltip: { callbacks: { label: c => {
            const p = gTotal ? Math.round(c.parsed / gTotal * 100) : 0;
            return c.label + ': ' + fmt(c.parsed) + ' M/D (' + p + '%)';
          }}}
        }
      }
    });
  }

  // 2) 업체별 공수 (세로 막대)
  destroyChart('detEqV');
  const vMap = new Map();
  for (const r of recs) {
    if (!r.v) continue;
    vMap.set(r.v, (vMap.get(r.v) || 0) + (r.m || 0));
  }
  const vEntries = VENDOR_ORDER
    .map(v => [v, vMap.get(v) || 0])
    .filter(([, val]) => val > 0);
  const vCanvas = document.getElementById('chartDetEqVendor');
  if (vCanvas && vEntries.length > 0) {
    charts.detEqV = new Chart(vCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: vEntries.map(e => VENDOR_LABEL.get(e[0]) || e[0]),
        datasets: [{ data: vEntries.map(e => e[1]),
          backgroundColor: vEntries.map((_, i) => PALETTE[i % PALETTE.length]),
          borderWidth: 0, maxBarThickness: 80 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 22 } },
        plugins: {
          legend: { display: false },
          barValue: { display: true },
          tooltip: { callbacks: { label: c => fmt(c.parsed.y) + ' M/D' } }
        },
        scales: {
          x: { ticks: { font: { size: 11 } }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }
        }
      }
    });
  }

  // 3) 작업자별 공수 (가로 막대)
  destroyChart('detEqW');
  const wMap = new Map();
  const wCatM = new Map();
  for (const r of recs) {
    if (!r.w) continue;
    wMap.set(r.w, (wMap.get(r.w) || 0) + (r.m || 0));
    const c = normalizeCategory(r.c);
    if (c) {
      if (!wCatM.has(r.w)) wCatM.set(r.w, new Map());
      const m = wCatM.get(r.w);
      m.set(c, (m.get(c) || 0) + (r.m || 0));
    }
  }
  const wEntries = Array.from(wMap.entries()).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const wLabels = wEntries.map(e => e[0]);
  const wValues = wEntries.map(e => e[1]);
  const wColors = wEntries.map(([w]) => {
    const m = wCatM.get(w);
    if (!m || m.size === 0) return PRIMARY;
    let max = -Infinity, maxC = null;
    for (const [c, v] of m) if (v > max) { max = v; maxC = c; }
    return CATEGORY_COLOR[maxC] || PRIMARY;
  });

  const WRAP_H = 420, SLOT_PX = 28, HEADER_PX = 50;
  const MIN_SLOTS = Math.floor((WRAP_H - HEADER_PX) / SLOT_PX);
  while (wLabels.length < MIN_SLOTS) { wLabels.push(''); wValues.push(null); wColors.push('rgba(0,0,0,0)'); }

  const wInner = document.getElementById('chartDetEqWorkerInner');
  if (wInner) wInner.style.height = Math.max(WRAP_H, wLabels.length * SLOT_PX + HEADER_PX) + 'px';
  const wCanvas = document.getElementById('chartDetEqWorker');
  if (wCanvas && wEntries.length > 0) {
    const xMax = wValues.reduce((a, b) => (typeof b === 'number' && b > a) ? b : a, 0) || 1;
    charts.detEqW = new Chart(wCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: wLabels,
        datasets: [{ data: wValues, backgroundColor: wColors, borderWidth: 0, maxBarThickness: 22, minBarLength: 2 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 20 } },
        plugins: {
          legend: { display: false },
          barValue: { display: true },
          tooltip: { filter: ctx => ctx.parsed.x != null,
                     callbacks: { label: c => fmt(c.parsed.x) + ' M/D' } }
        },
        scales: {
          x: { beginAtZero: true, max: xMax, display: false, grid: { color: '#f0f0f0' } },
          y: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
    renderStickyXAxis('chartDetEqWorkerAxis', 'detEqWAxis', xMax, charts.detEqW.chartArea ? charts.detEqW.chartArea.left : 0);
    requestAnimationFrame(() => {
      if (!charts.detEqW) return;
      const left = charts.detEqW.chartArea ? charts.detEqW.chartArea.left : 0;
      renderStickyXAxis('chartDetEqWorkerAxis', 'detEqWAxis', xMax, left);
    });
  }

  // 4) 주차별 평균 진행률 (마스터 분모 + 누적 max) + 목표선 (Tool In → SL2) + SL1 마커
  destroyChart('detEqWk');
  const wkCatMap = new Map();
  for (const r of recs) {
    if (typeof r.p !== 'number' || !r.d) continue;
    const c = normalizeCategory(r.c);
    if (!c) continue;
    const w = isoWeek(r.d);
    if (!w) continue;
    if (!wkCatMap.has(w)) wkCatMap.set(w, new Map());
    const cMap = wkCatMap.get(w);
    const prev = cMap.has(c) ? cMap.get(c) : -Infinity;
    if (r.p > prev) cMap.set(c, r.p);
  }
  const dataWeeks = Array.from(wkCatMap.keys()).sort();

  const schedule = EQUIP_SCHEDULE.get(eq);
  let scheduleWeeks = [];
  let wTin = null, wSL1 = null, wSL2 = null;
  let sl1Pct = null;
  if (schedule) {
    if (schedule.toolIn) wTin = isoWeek(schedule.toolIn);
    if (schedule.sl1) wSL1 = isoWeek(schedule.sl1);
    if (schedule.sl2) wSL2 = isoWeek(schedule.sl2);
    if (schedule.toolIn && schedule.sl2) {
      scheduleWeeks = isoWeeksBetween(schedule.toolIn, schedule.sl2);
      if (schedule.sl1) {
        const tinT = new Date(schedule.toolIn + 'T00:00:00Z').getTime();
        const sl1T = new Date(schedule.sl1 + 'T00:00:00Z').getTime();
        const sl2T = new Date(schedule.sl2 + 'T00:00:00Z').getTime();
        if (sl2T > tinT) sl1Pct = ((sl1T - tinT) / (sl2T - tinT)) * 100;
      }
    }
  }

  const allWeeks = Array.from(new Set([...dataWeeks, ...scheduleWeeks])).sort();
  const masterForWeek = getEquipMasterCategories(eq);
  const cumByCat = new Map();
  const weekAvg = allWeeks.map(w => {
    const cw = wkCatMap.get(w);
    if (cw) {
      for (const [c, v] of cw) {
        const prev = cumByCat.has(c) ? cumByCat.get(c) : -Infinity;
        if (v > prev) cumByCat.set(c, v);
      }
    }
    if (cumByCat.size === 0) return null;
    if (masterForWeek && masterForWeek.length > 0) {
      let total = 0;
      for (const c of masterForWeek) total += clamp01(cumByCat.has(c) ? cumByCat.get(c) : 0);
      return total / masterForWeek.length;
    }
    let total = 0;
    for (const v of cumByCat.values()) total += clamp01(v);
    return total / cumByCat.size;
  });

  let targetData = null, sl1Data = null;
  if (wTin && wSL2 && scheduleWeeks.length >= 2) {
    const startIdx = allWeeks.indexOf(wTin);
    const endIdx = allWeeks.indexOf(wSL2);
    if (startIdx >= 0 && endIdx >= 0) {
      targetData = allWeeks.map((w, i) => {
        if (i < startIdx || i > endIdx) return null;
        if (endIdx === startIdx) return 100;
        return +(((i - startIdx) / (endIdx - startIdx)) * 100).toFixed(1);
      });
      if (wSL1 && sl1Pct != null) {
        const sIdx = allWeeks.indexOf(wSL1);
        if (sIdx >= 0) {
          sl1Data = allWeeks.map(() => null);
          sl1Data[sIdx] = +sl1Pct.toFixed(1);
        }
      }
    }
  }

  const datasets = [{
    label: '평균 진행률',
    data: weekAvg.map(v => v == null ? null : +(v * 100).toFixed(1)),
    borderColor: PRIMARY,
    backgroundColor: 'rgba(46,125,50,0.1)',
    pointBackgroundColor: PRIMARY,
    pointBorderColor: '#fff',
    pointRadius: 5, pointHoverRadius: 7,
    tension: 0.3, borderWidth: 2, fill: true,
    spanGaps: true
  }];
  if (targetData) {
    datasets.push({
      label: '목표 (Tool In → SL2)',
      data: targetData,
      borderColor: '#dc3545',
      backgroundColor: 'transparent',
      pointBackgroundColor: '#dc3545',
      pointBorderColor: '#fff',
      pointRadius: 3, pointHoverRadius: 5,
      tension: 0, borderWidth: 2, borderDash: [6, 4], fill: false,
      spanGaps: true
    });
  }
  if (sl1Data) {
    datasets.push({
      label: 'SL1',
      data: sl1Data,
      borderColor: 'transparent',
      backgroundColor: '#fd7e14',
      pointBackgroundColor: '#fd7e14',
      pointBorderColor: '#fff',
      pointStyle: 'rectRot',
      pointRadius: 9, pointHoverRadius: 11,
      showLine: false, fill: false,
      spanGaps: true
    });
  }

  const wkCanvas = document.getElementById('chartDetEqWeek');
  if (wkCanvas && allWeeks.length > 0) {
    charts.detEqWk = new Chart(wkCanvas.getContext('2d'), {
      type: 'line',
      data: { labels: allWeeks, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: !!targetData, position: 'top', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
          tooltip: { callbacks: {
            label: c => {
              const lbl = c.dataset.label || '';
              if (c.parsed.y == null) return lbl + ': -';
              if (lbl === 'SL1' && schedule && schedule.sl1) return 'SL1 (' + schedule.sl1 + '): ' + c.parsed.y.toFixed(1) + '%';
              if (lbl.startsWith('목표') && schedule) {
                let extra = '';
                const w = allWeeks[c.dataIndex];
                if (w === wTin && schedule.toolIn) extra = ' — Tool In ' + schedule.toolIn;
                else if (w === wSL2 && schedule.sl2) extra = ' — SL2 ' + schedule.sl2;
                return lbl + ': ' + c.parsed.y.toFixed(1) + '%' + extra;
              }
              return lbl + ': ' + c.parsed.y.toFixed(1) + '%';
            }
          }}
        },
        scales: {
          x: { ticks: { font: { size: 11 } }, grid: { color: '#f0f0f0' } },
          y: {
            beginAtZero: true, max: 100,
            ticks: { font: { size: 10 }, stepSize: 25, callback: v => v + '%' },
            grid: { color: '#f0f0f0' }
          }
        }
      }
    });
  }
}

function render() {
  const data = applyFilter();
  document.getElementById('recordCount').textContent = data.length;
  rebuildFilterOptions();
  renderKPI(data);
  renderBreadcrumb();

  const mainView = document.getElementById('mainView');
  const detailView = document.getElementById('detailView');

  if (state.view === 'main') {
    mainView.style.display = '';
    detailView.style.display = 'none';
    detailView.innerHTML = '';
    renderCategory(applyFilter('category'));
    renderVendor(applyFilter('vendor', 'worker'));
    renderHeatmap(data);
    renderNotes(data);
    // 설비 검색 시 TOP 10 카드 숨김
    const top10Card = document.getElementById('chartTop10Card');
    if (state.equip.trim()) {
      if (top10Card) top10Card.style.display = 'none';
      destroyChart('top10');
    } else {
      if (top10Card) top10Card.style.display = '';
      renderTop10(data);
    }
  } else {
    mainView.style.display = 'none';
    // 메인 차트 destroy (캔버스 hidden 상태에서 누적되지 않도록)
    destroyChart('cat'); destroyChart('ven'); destroyChart('top10');
    detailView.style.display = '';
    let html = '';
    switch (state.view) {
      case 'list-inprogress': html = renderListInProgress(data); break;
      case 'list-completed':  html = renderListCompleted(data); break;
      case 'list-worker':     html = renderListWorker(data); break;
      case 'detail-equip':    html = renderDetailEquip(data); break;
      case 'detail-worker':   html = renderDetailWorker(data); break;
    }
    detailView.innerHTML = html;
    // 상세 차트 후처리
    if (state.view === 'detail-equip') renderDetailEquipCharts(data);
    else if (state.view === 'detail-worker') renderDetailWorkerCharts(data);
    else {
      destroyChart('detEqG'); destroyChart('detEqV'); destroyChart('detEqW'); destroyChart('detEqWk'); destroyChart('detWkE');
    }
  }
}

renderDailyCompare(_stored, cstYesterday(), cstToday());
document.getElementById('exportedAt').textContent = '데이터 기준: ' + (RAW.meta.exported_at || '-');
document.getElementById('recordTotal').textContent = RAW.records.length;
setupFilters();
setupKpiClicks();
render();
renderNotes(_stored);
</script>
